<title>Nikke 属性计算器</title>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #1e1e24;
  color: #f5f5f5;
  display: flex;
  justify-content: center;
  padding-top: 50px;
}

.container {
  background: #2b2b36;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  width: 340px;
}

h2 {
  font-size: 1.2rem;
  text-align: center;
  margin-top: 0;
  color: #ffca28;
}

.input-group {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
}

.row-group {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.half-width {
  flex: 1;
  min-width: 0;
}

.half-width input {
  width: 100%;
  box-sizing: border-box;
}

label {
  margin-bottom: 5px;
  font-size: 0.9rem;
  color: #b0bec5;
}

select, input {
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #454555;
  background: #1e1e24;
  color: #fff;
  font-size: 1rem;
}

select:focus, input:focus {
  outline: none;
  border-color: #ffca28;
}

.level-hint {
  margin: -8px 0 10px;
  font-size: 0.8rem;
  color: #ff8a65;
}

.level-hint:empty {
  display: none;
}

.result-card {
  margin-top: 10px;
  background: #1e1e24;
  padding: 15px;
  border-radius: 8px;
  border-left: 4px solid #ffca28;
}

.result-card h3 {
  margin: 0 0 15px 0;
  font-size: 1rem;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  font-size: 1.1rem;
}

.stat-value {
  font-weight: bold;
  font-family: monospace;
  color: #4fc3f7;
}

.note {
  font-size: 0.75rem;
  color: #78909c;
  margin-top: 15px;
  text-align: center;
}

.scope-note {
  margin: -6px 0 16px;
  color: #ffb74d;
}
</style>
</head>
<body>
<div class="container">
  <h2>妮姬 (NIKKE) 属性计算器</h2>
  <p class="note scope-note">仅支持 SSR 角色；SR / R 角色暂未制作</p>

  <div class="row-group">
    <div class="input-group half-width">
      <label for="classSelect">角色类型 (Class):</label>
      <select id="classSelect">
        <option value="Attacker">火力型 (Attacker)</option>
        <option value="Supporter">辅助型 (Supporter)</option>
        <option value="Defender">防御型 (Defender)</option>
      </select>
    </div>

    <div class="input-group half-width">
      <label for="weaponSelect">武器类型 (Weapon):</label>
      <select id="weaponSelect">
        <option value="SG" selected>SG</option>
        <option value="SMG">SMG</option>
        <option value="AR">AR（含哈兰）</option>
        <option value="MG">MG</option>
        <option value="SR">SR</option>
        <option value="RL">RL</option>
      </select>
    </div>
  </div>

  <div class="input-group">
    <label for="levelInput">目标等级 (Level):</label>
    <input type="number" id="levelInput" value="400" min="1" max="1400">
  </div>

  <div class="row-group">
    <div class="input-group half-width">
      <label for="gradeInput">星级 (Grade 0-3):</label>
      <input type="number" id="gradeInput" value="0" min="0" max="3" step="1">
    </div>

    <div class="input-group half-width">
      <label for="coreInput">突破 (Core 0-7):</label>
      <input type="number" id="coreInput" value="0" min="0" max="7" step="1">
    </div>
  </div>

  <div class="row-group">
    <div class="input-group half-width">
      <label for="generalResearchInput">通用循环室等级:</label>
      <input type="number" id="generalResearchInput" value="0" min="0" step="1">
    </div>

    <div class="input-group half-width">
      <label for="bondInput">好感度等级 (1-40):</label>
      <input type="number" id="bondInput" value="1" min="1" max="40" step="1">
    </div>
  </div>

  <div class="row-group">
    <div class="input-group half-width">
      <label for="classResearchInput">职业循环室等级:</label>
      <input type="number" id="classResearchInput" value="0" min="0" step="1">
    </div>

    <div class="input-group half-width">
      <label for="corpResearchInput">企业循环室等级:</label>
      <input type="number" id="corpResearchInput" value="0" min="0" step="1">
    </div>
  </div>

  <div class="result-card">
    <h3>计算结果 (Level <span id="displayLevel">400</span>)</h3>
    <p class="level-hint" id="levelHint"></p>
    <div class="stat-row">
      <span class="stat-label">❤️ HP:</span>
      <span class="stat-value" id="resHP">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">⚔️ ATK:</span>
      <span class="stat-value" id="resATK">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">🛡️ DEF:</span>
      <span class="stat-value" id="resDEF">0</span>
    </div>
  </div>
  <p class="note">* 等级 + 突破 + 循环室 + 好感度，乘核心倍率后取整（不含装备 / 魔方 / 珍藏品）<br>
    * 等级属性取自游戏等级表：ATK / HP 由职业决定，DEF 由职业 + 武器类型决定（哈兰按 AR 计）<br>
    * 仅含 SSR 角色；SR / R 角色的等级表不同，暂未制作</p>
</div>

// 解码：差分累加还原逐级数值，下标 = 等级 - 1
function decodeLevelTable(s) {
  const out = [];
  let acc = 0;
  for (const part of s.split(',')) {
    const [d, n] = part.split('*').map(Number);
    for (let k = 0; k < (n || 1); k++) { acc += d; out.push(acc); }
  }
  return out;
}

const LEVEL_TABLE = {};

  LEVEL_TABLE[cls] = { ATK: decodeLevelTable(t.ATK), HP: decodeLevelTable(t.HP), DEF: {} };
  for (const [weapon, s] of Object.entries(t.DEF)) LEVEL_TABLE[cls].DEF[weapon] = decodeLevelTable(s);
}

// 取某职业 + 武器的三张等级表
function levelTables(nikkeClass, weapon) {
  const t = LEVEL_TABLE[nikkeClass];
  return { ATK: t.ATK, HP: t.HP, DEF: t.DEF[weapon] };
}

// 读取整数输入并夹到 [min, max]。writeBack 为 true 时把规整后的值写回输入框：
// 输入过程中（input 事件）不写回，以免打断键入；提交时（change 事件，失焦 / 回车 / 微调箭头）才写回。
function readInt(el, min, max, writeBack = false) {
  let v = parseInt(el.value, 10);
  if (isNaN(v)) v = min;
  v = Math.min(max, Math.max(min, v));
  if (writeBack && String(v) !== el.value) el.value = v;
  return v;
}

// 单项基础属性（与模拟器 src/engine/stats.js computeBaseStat 及 blablalink shiftyspad 一致）：
//   A    = floor(等级属性 × (1 + 星级 × 2%) + 星级 × 固定值)
//   结果 = round((A + floor(循环室) + round(好感度)) × (1 + 突破 × 2%))
// 突破倍率同时放大循环室与好感度加成。
function calculateFinalStat(stat, p) {
  const levelValue = p.tables[stat][p.level - 1];
  const gradeMult  = 1 + p.grade * STAT_ENHANCE.grade_ratio * 1e-4;
  const levelPart  = Math.floor(levelValue * gradeMult + p.grade * STAT_ENHANCE.grade[stat]);
  const research   = p.general * RESEARCH_PER_LV.general[stat]
                   + p.classLv * RESEARCH_PER_LV.class[stat]
                   + p.corpLv  * RESEARCH_PER_LV.corp[stat];
  const bond       = BOND_TABLE[p.nikkeClass][p.bond - 1][BOND_INDEX[stat]];
  const coreMult   = 1 + p.core * STAT_ENHANCE.core[stat] * 1e-4;
  return Math.round((levelPart + Math.floor(research) + Math.round(bond)) * coreMult);
}

const levelInput = document.getElementById('levelInput');
const levelHint  = document.getElementById('levelHint');

// 读取全部参数并计算。commit 为 true（change 事件）时规整输入框的值并执行星级 / 突破联动；
// 为 false（input 事件）时只按规整后的值计算，不改动正在编辑的输入框。
function calculate(commit = false, source = null) {
  const nikkeClass = document.getElementById('classSelect').value;
  const weapon = document.getElementById('weaponSelect').value;
  const tables = levelTables(nikkeClass, weapon);
  // 各表长度可能不同（个别组合只有 1200 级），取三张表中最短的作为上限
  const maxLevel = Math.min(tables.ATK.length, tables.HP.length, tables.DEF.length);
  levelInput.max = maxLevel;

  // 星级 / 突破联动：改星级到 3 以下时突破归零；有突破时星级必为 3
  let grade = readInt(gradeInput, 0, 3, commit);
  let core  = readInt(coreInput, 0, 7, commit);
  if (commit && source === gradeInput && grade < 3 && core > 0) { core = 0; coreInput.value = 0; }
  if (core > 0 && grade < 3) { grade = 3; if (commit) gradeInput.value = 3; }

  const p = {
    nikkeClass, grade, core, tables,
    general: readInt(document.getElementById('generalResearchInput'), 0, 99999, commit),
    classLv: readInt(document.getElementById('classResearchInput'), 0, 99999, commit),
    corpLv:  readInt(document.getElementById('corpResearchInput'), 0, 99999, commit),
    bond:    readInt(document.getElementById('bondInput'), 1, 40, commit),
  };

  // 等级：提交时夹到有效范围；输入过程中超出范围则提示并暂不显示数值
  const rawLevel = parseInt(levelInput.value, 10);
  if (commit) {
    p.level = readInt(levelInput, 1, maxLevel, true);
  } else if (isNaN(rawLevel) || rawLevel < 1 || rawLevel > maxLevel) {
    levelHint.textContent = `该职业 + 武器类型目前只有 1–${maxLevel} 级数据`;
    document.getElementById('displayLevel').textContent = levelInput.value || '—';
    for (const id of ['resHP', 'resATK', 'resDEF']) document.getElementById(id).textContent = '—';
    return;
  } else {
    p.level = rawLevel;
  }
  levelHint.textContent = '';

  document.getElementById('displayLevel').textContent = p.level;
  document.getElementById('resATK').textContent = calculateFinalStat('ATK', p).toLocaleString();
  document.getElementById('resDEF').textContent = calculateFinalStat('DEF', p).toLocaleString();
  document.getElementById('resHP').textContent  = calculateFinalStat('HP',  p).toLocaleString();
}

// 任意参数变化即重算：input 事件（键入时）实时计算，change 事件（提交时）规整并联动后再计算
for (const el of document.querySelectorAll('.container input, .container select')) {
  el.addEventListener('input',  () => calculate(false, el));
  el.addEventListener('change', () => calculate(true, el));
}

// 页面加载时自动计算一次
calculate(true);
</script>
</body>
