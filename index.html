<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIKKE 战斗模拟器</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/pico-forms.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── 加载遮罩（Alpine 启动前显示，文案由 main.js 按保存的界面语言填写） ── -->
  <div id="loader">
    <div class="loader-box">
      <div class="loader-title">⚡ <span id="loaderTitle">NIKKE 战斗模拟器</span></div>
      <p id="loadProgress" class="loader-msg">正在初始化…</p>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- ── 主应用（Alpine 挂载点） ────────────────────────────── -->
  <div id="app"
       x-data
       x-init="$store.sim.init().then(() => {
         document.getElementById('loader').style.display = 'none';
         document.getElementById('app').classList.remove('hidden');
       })">

    <!-- ── 顶栏 ─────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-brand" x-text="'⚡ ' + $t('app.title')"></div>
      <!-- 开始模拟：标题栏居中 -->
      <button type="button" class="btn btn-primary topbar-run"
        :disabled="$store.sim.simRunning"
        @click="$store.sim.runSimulate()">
        <span x-text="$store.sim.simRunning ? $t('sim.running') : $t('sim.start')"></span>
      </button>
      <div class="topbar-right">
        <span class="topbar-status" x-text="$store.sim.accountStatusText"></span>
        <template x-if="$store.sim.devMode">
          <button class="btn btn-ghost btn-sm" :title="$t('top.reloadDevTitle')"
            @click="$store.sim.reloadAccountFromDev()" x-text="$t('top.importAccount')">
          </button>
        </template>
        <template x-if="!$store.sim.devMode">
          <label class="btn btn-ghost btn-sm" :title="$t('top.importTitle')">
            <span x-text="$t('top.importAccount')"></span>
            <input type="file" accept=".json" class="visually-hidden"
              @change="e => $store.sim.importAccount(e.target.files[0]).then(() => e.target.value = '')">
          </label>
        </template>
        <!-- 模拟记录：弹窗查看最近的模拟结果 -->
        <button type="button" class="btn btn-ghost btn-sm topbar-history-btn"
          :title="$t('top.historyTitle', { n: $store.sim.SIM_HISTORY_MAX })"
          aria-haspopup="dialog"
          @click="$store.sim.simHistoryOpen = true">
          <span x-text="$t('top.history')"></span>
          <span class="topbar-badge mono" x-show="$store.sim.simHistory.length"
            x-text="$store.sim.simHistory.length"></span>
        </button>
        <!-- 界面语言切换：分段按钮，当前语言高亮 -->
        <div class="lang-switch" role="group" :aria-label="$t('lang.label')">
          <template x-for="l in $store.sim.LANGS" :key="l.code">
            <button type="button" class="lang-switch-btn"
              :class="{ 'lang-switch-btn--active': $store.sim.lang === l.code }"
              :aria-pressed="$store.sim.lang === l.code"
              @click="$store.sim.setLang(l.code)"
              x-text="l.label"></button>
          </template>
        </div>
      </div>
    </header>

    <!-- ── 三栏布局 ──────────────────────────────────────────── -->
    <div class="layout">

      <!-- ╔══ 左栏：全局配置 ══╗ -->
      <aside class="panel panel-left">
        <div class="panel-scroll">

          <!-- 同步器与研究 -->
          <section class="card">
            <h2 class="card-title" x-text="$t('global.title')"></h2>
            <div class="row-2">
              <div class="field-group">
                <label class="field-label" x-text="$t('global.synchroLevel')"></label>
                <input class="input" type="number" min="1" max="1200"
                  x-model.number="$store.sim.synchroLevel">
              </div>
              <div class="field-group">
                <label class="field-label" x-text="$t('global.generalResearch')"></label>
                <input class="input" type="number" min="0" max="1200"
                  x-model.number="$store.sim.generalResearch">
              </div>
            </div>
            <div class="section-sub" x-text="$t('global.classResearch')"></div>
            <div class="row-3">
              <template x-for="cls in $store.sim.CLASS_ORDER" :key="cls">
                <div class="field-group">
                  <label class="field-label field-label--icon">
                    <span class="hex-chip hex-chip--light hex-chip--xs" aria-hidden="true">
                      <img :src="$store.sim.classIcon(cls)" alt="">
                    </span>
                    <span x-text="$store.sim.classLabel(cls)"></span>
                  </label>
                  <input class="input" type="number" min="0" max="999"
                    :value="$store.sim.classResearch[cls.toLowerCase()]"
                    @input="$store.sim.classResearch[cls.toLowerCase()] = +$event.target.value">
                </div>
              </template>
            </div>
            <div class="section-sub" x-text="$t('global.corpResearch')"></div>
            <div class="row-3">
              <template x-for="corp in $store.sim.CORP_ORDER" :key="corp">
                <div class="field-group">
                  <label class="field-label field-label--icon">
                    <span class="hex-chip hex-chip--light hex-chip--xs" aria-hidden="true">
                      <img class="corp-img" :src="$store.sim.corpIcon(corp)" alt="">
                    </span>
                    <span x-text="$store.sim.corpLabel(corp)"></span>
                  </label>
                  <input class="input" type="number" min="0" max="999"
                    :value="$store.sim.corpResearch[corp]"
                    @input="$store.sim.corpResearch[corp] = +$event.target.value">
                </div>
              </template>
            </div>
          </section>

          <!-- 敌人配置 -->
          <section class="card">
            <div class="card-title-row">
              <h2 class="card-title" style="margin-bottom:0;white-space:nowrap" x-text="$t('enemy.title')"></h2>
              <div class="enemy-preset-controls">
                <select class="input input-sm enemy-preset-select"
                  :value="$store.sim.selectedPresetId ?? ''"
                  @change="$store.sim.loadEnemyPreset($event.target.value)">
                  <option value="" x-text="$t('enemy.savedPresets')"></option>
                  <template x-for="p in $store.sim.enemyPresets" :key="p.id">
                    <option :value="p.id" x-text="p.name"></option>
                  </template>
                </select>
                <button class="btn btn-ghost btn-sm"
                  :disabled="!$store.sim.selectedPresetId"
                  @click="$store.sim.renameEnemyPreset($store.sim.selectedPresetId)"
                  :title="$t('common.rename')">✎</button>
                <button class="btn btn-ghost btn-sm"
                  :disabled="!$store.sim.selectedPresetId"
                  @click="$store.sim.deleteEnemyPreset($store.sim.selectedPresetId)"
                  :title="$t('common.delete')">×</button>
              </div>
            </div>
            <!-- 敌人代码：五个图标单选（燃烧-风压-铁甲-电击-水冷），选中项高亮 -->
            <div class="enemy-element-inline">
              <span class="enemy-inline-label" id="enemyCodeLabel" x-text="$t('enemy.code')"></span>
              <div class="code-picker" role="radiogroup" aria-labelledby="enemyCodeLabel">
                <template x-for="el in $store.sim.ELEMENT_ORDER" :key="el">
                  <button type="button" class="code-pick" role="radio"
                    :class="{ 'code-pick--on': el === $store.sim.enemy.element }"
                    :aria-checked="el === $store.sim.enemy.element"
                    :title="$store.sim.elementLabel(el)"
                    :aria-label="$store.sim.elementLabel(el)"
                    @click="$store.sim.enemy.element = el; $store.sim.selectedPresetId = null">
                    <img :src="$store.sim.elementIcon(el)" alt="">
                  </button>
                </template>
              </div>
            </div>

            <div class="section-sub mt-1" x-text="$t('enemy.actions')"></div>
            <table class="enemy-actions-table">
              <thead>
                <tr>
                  <th x-text="$t('enemy.colTime')"></th>
                  <th x-text="$t('enemy.colType')"></th>
                  <th x-text="$t('enemy.colValue')"></th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(action, idx) in $store.sim.enemy.actions" :key="action.id">
                  <tr>
                    <td>
                      <template x-if="idx < 3">
                        <span class="action-fixed-cell">0</span>
                      </template>
                      <template x-if="idx >= 3">
                        <input class="input input-sm" type="number" min="0" max="180"
                          :value="action.startTimeS"
                          @input="$store.sim.updateEnemyAction(action.id, 'startTimeS', +$event.target.value)"
                          @blur="$store.sim.sortEnemyActions()">
                      </template>
                    </td>
                    <td>
                      <template x-if="idx < 3">
                        <span class="action-fixed-cell"
                          :title="action.type === 'position' ? $t('enemy.distanceTip') : ''"
                          x-text="$t('enemy.type.' + action.type)"></span>
                      </template>
                      <template x-if="idx >= 3">
                        <select class="input input-sm"
                          :value="action.type"
                          :title="action.type === 'position' ? $t('enemy.distanceTip') : ''"
                          @change="$store.sim.updateEnemyAction(action.id, 'type', $event.target.value)">
                          <template x-for="tp in ['def','core','position','hidden']" :key="tp">
                            <option :value="tp" :selected="tp === action.type" x-text="$t('enemy.type.' + tp)"></option>
                          </template>
                        </select>
                      </template>
                    </td>
                    <td>
                      <template x-if="action.type === 'def'">
                        <input class="input input-sm" type="number" min="0"
                          :value="action.value"
                          @input="$store.sim.updateEnemyAction(action.id, 'value', +$event.target.value)">
                      </template>
                      <template x-if="action.type === 'core'">
                        <select class="input input-sm"
                          :value="action.value"
                          @change="$store.sim.updateEnemyAction(action.id, 'value', $event.target.value)">
                          <template x-for="cv in ['EXPOSED','PROTECTED','PARTS_CORE','NONE']" :key="cv">
                            <option :value="cv" :selected="cv === action.value"
                              :title="cv === 'PARTS_CORE' ? $t('enemy.partsCoreTip') : ''"
                              x-text="$t('enemy.core.' + cv)"></option>
                          </template>
                        </select>
                      </template>
                      <template x-if="action.type === 'position'">
                        <input class="input input-sm" type="number" min="0" max="100" step="1"
                          :value="action.value"
                          @input="$store.sim.updateEnemyAction(action.id, 'value', +$event.target.value)"
                          :title="$t('enemy.distanceValueTip')">
                      </template>
                      <template x-if="action.type === 'hidden'">
                        <span class="action-fixed-cell" :title="$t('enemy.hiddenTip')">—</span>
                      </template>
                    </td>
                    <td>
                      <template x-if="idx >= 3">
                        <button class="btn-icon btn-remove-action" @click="$store.sim.removeEnemyAction(action.id)" :title="$t('common.delete')">−</button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <button class="btn-add-action" @click="$store.sim.addEnemyAction()" x-text="$t('enemy.addAction')"></button>
            <aside class="core-note" role="note"
              x-show="$store.sim.enemy.actions.some(a => a.type === 'core' && a.value === 'PARTS_CORE')"
              x-html="$t('enemy.partsCoreNote')">
            </aside>

            <!-- 敌人配置 JSON 导入 / 导出 -->
            <div class="enemy-io-row">
              <button type="button" class="btn btn-ghost btn-sm"
                :title="$t('enemyIo.exportTitle')"
                @click="$store.sim.exportEnemyConfig()"
                x-text="$t('enemyIo.export')"></button>
              <button type="button" class="btn btn-ghost btn-sm"
                :title="$t('enemyIo.importTitle')"
                @click="$store.sim.importEnemyConfig()"
                x-text="$t('enemyIo.import')"></button>
            </div>
          </section>

          <!-- 模拟选项 -->
          <section class="card">
            <h2 class="card-title" x-text="$t('sim.title')"></h2>
            <p class="hint" x-text="$t('sim.durationHint')"></p>
            <!-- 迭代次数 + 锁定等级同一行 -->
            <div class="row-2">
              <div class="field-group">
                <label class="field-label" x-text="$t('sim.iterations')"></label>
                <input class="input" type="number" min="1" max="100"
                  x-model.number="$store.sim.iterations">
              </div>
              <div class="field-group">
                <label class="field-label" x-text="$t('sim.levelLock')"></label>
                <select class="input" x-model.number="$store.sim.levelLock">
                  <template x-for="lv in $store.sim.LEVEL_LOCK_OPTIONS" :key="lv">
                    <option :value="lv" :selected="lv === $store.sim.levelLock"
                      x-text="lv ? $t('sim.levelLock.lv', { lv }) : $t('sim.levelLock.none')"></option>
                  </template>
                </select>
              </div>
            </div>
            <p class="hint mt-1" x-show="$store.sim.levelLock > 0" x-text="$t('sim.levelLock.hint')"></p>
            <div class="field-group">
              <label class="field-label">
                <span x-text="$t('sim.burstDelay')"></span>
                <span class="field-hint" x-text="' (' + $store.sim.burstStepSecs.toFixed(2) + 's)'"></span>
              </label>
              <input type="range" class="input-range" min="0.1" max="0.4" step="0.05"
                x-model.number="$store.sim.burstStepSecs">
              <div class="range-labels">
                <span>0.1s</span><span>0.4s</span>
              </div>
            </div>
            <!-- 命中参数：核心命中率几何模型校准 + 实战命中校正（随敌人距离缩放） -->
            <div class="field-group">
              <label class="field-label" x-text="$t('sim.hitCal')"></label>
              <div class="hit-cal-row" :title="$t('sim.hitCalTip')">
                <label>CORE0
                  <input class="input input-sm" type="number" min="0" step="1"
                    x-model.number="$store.sim.hitCal.core0">
                </label>
                <label>D0
                  <input class="input input-sm" type="number" min="1" step="1"
                    x-model.number="$store.sim.hitCal.d0">
                </label>
                <label><span x-text="$t('sim.hitCoef')"></span>
                  <input class="input input-sm" type="number" min="0" step="0.1"
                    x-model.number="$store.sim.hitCal.hitCoef">
                </label>
              </div>
              <div class="hit-cal-row" :title="$t('sim.hitRealTip')">
                <label><span x-text="$t('sim.rlCoreRate')"></span>
                  <input class="input input-sm" type="number" min="0" max="1" step="0.01"
                    x-model.number="$store.sim.hitCal.rlCoreRate">
                </label>
                <label><span x-text="$t('sim.sgHitRate')"></span>
                  <input class="input input-sm" type="number" min="0" max="1" step="0.01"
                    x-model.number="$store.sim.hitCal.sgHitRate">
                </label>
              </div>
            </div>
            <!-- 角色专属策略选项 -->
            <template x-if="$store.sim.hasEbsBoomAndShock">
              <div class="field-group mt-1">
                <label class="checkbox-label">
                  <input type="checkbox" x-model="$store.sim.ebsLastBurstOnly">
                  <span x-text="$t('sim.lastBurstOnly', { name: $store.sim.charName(502, 'Elegg: Boom and Shock') })"></span>
                </label>
              </div>
            </template>
            <template x-if="$store.sim.hasMaidenIceRose">
              <div class="field-group mt-1">
                <label class="checkbox-label">
                  <input type="checkbox" x-model="$store.sim.mirLastBurstOnly">
                  <span x-text="$t('sim.lastBurstOnly', { name: $store.sim.charName(183, 'Maiden: Ice Rose') })"></span>
                </label>
              </div>
            </template>
            <template x-if="$store.sim.hasCinderellaCrystalWave">
              <div class="field-group mt-1">
                <label class="checkbox-label">
                  <input type="checkbox" x-model="$store.sim.ccwSnipeModeAtStart">
                  <span x-text="$t('sim.ccwSnipe', { name: $store.sim.charName(515, 'Cinderella: Crystal Wave'), mode: $store.sim.effectName(515, 'Snipe Mode') })"></span>
                </label>
              </div>
            </template>
            <template x-if="$store.sim.hasMastRomanticMaid">
              <div class="field-group mt-1">
                <label class="field-label" x-text="$t('sim.mastBurst', { name: $store.sim.charName(354, 'Mast: Romantic Maid') })"></label>
                <select class="input input-sm" x-model="$store.sim.mastBurstMode">
                  <template x-for="opt in $store.sim.mastBurstOptions" :key="opt.value">
                    <option :value="opt.value" x-text="opt.label"
                      :selected="opt.value === $store.sim.effectiveMastBurstMode"></option>
                  </template>
                </select>
              </div>
            </template>
          </section>

        </div>
      </aside>

      <!-- ╔══ 中栏：队伍构建 ══╗ -->
      <div class="panel panel-center">

        <!-- 槽位选择条 -->
        <div class="slot-bar">
          <template x-for="(slot, i) in $store.sim.team" :key="i">
            <button class="slot-tab"
              :class="{
                'slot-tab--active':  $store.sim.activeSlot === i,
                'slot-tab--filled':  !!slot.resourceId,
                'slot-tab--disabled': !slot.active && !slot.resourceId,
                'slot-tab--dragging':    $store.sim.dragFrom === i,
                'slot-tab--drop-target': $store.sim.dropTarget === i && $store.sim.dragFrom !== i
              }"
              :title="slot.resourceId ? $store.sim.slotName(slot) + $t('slot.dragHint') : ''"
              :draggable="!!slot.resourceId"
              @dragstart="$store.sim.onSlotDragStart(i, $event)"
              @dragover="$store.sim.onSlotDragOver(i, $event)"
              @dragleave="if ($store.sim.dropTarget === i) $store.sim.dropTarget = -1"
              @drop.prevent="$store.sim.onSlotDrop(i)"
              @dragend="$store.sim.onSlotDragEnd()"
              @click="$store.sim.handleSlotClick(i)">
              <div class="slot-tab-avatar"
                :class="{ 'slot-tab-avatar--empty': !slot.resourceId }"
                :style="slot.resourceId ? 'background-image:url(src/data/static/images/sm/' + String(slot.resourceId).padStart(3,'0') + '_00.webp)' : ''">
              </div>
              <!-- Focus（受控）角色选择：仅蓄力武器（SR/RL）显示；点击切换，吃充能加成 -->
              <span class="slot-focus-badge"
                x-show="!!slot.resourceId && ['SR','RL'].includes(slot.weaponType)"
                :class="{ 'slot-focus-badge--on': $store.sim.focusSlot === i }"
                @click.stop="$store.sim.focusSlot = ($store.sim.focusSlot === i ? null : i)"
                :title="$t('slot.focusTip')">F</span>
              <span class="slot-tab-name" x-text="slot.resourceId ? $store.sim.slotName(slot) : $t('slot.empty')"></span>
            </button>
          </template>
        </div>

        <!-- 活跃槽位详情 -->
        <div class="panel-scroll slot-detail">

          <!-- 空槽位 -->
          <template x-if="!$store.sim.activeSlotData.resourceId">
            <div class="empty-slot">
              <div class="empty-slot-num" x-text="$t('slot.slotN', { n: $store.sim.activeSlot + 1 })"></div>
              <button class="btn btn-primary"
                @click="$store.sim.openCharPicker($store.sim.activeSlot)"
                x-text="$t('slot.pick')">
              </button>
            </div>
          </template>

          <!-- 已选角色 -->
          <template x-if="$store.sim.activeSlotData.resourceId">
            <div class="slot-form" x-data="{ showSkills: true, showEquip: true, showCube: true, showFav: true }">

              <!-- 角色头部 -->
              <div class="char-header">
                <div class="char-info">
                  <div class="char-name" x-text="$store.sim.slotName($store.sim.activeSlotData)"></div>
                  <!-- 角色信息图标行：爆裂阶段 / 代码 / 武器 / 职业 / 企业 / 好感度（含输入框） -->
                  <div class="char-tags" x-data="{ get s() { return $store.sim.activeSlotData; } }">
                    <span class="hex-chip hex-chip--dark" role="img"
                      :title="$store.sim.burstLabel($store.sim.slotBurstStep(s))"
                      :aria-label="$store.sim.burstLabel($store.sim.slotBurstStep(s))">
                      <img :src="$store.sim.slotBurstIcon(s)" alt="">
                    </span>
                    <img class="code-chip" x-show="$store.sim.elementIcon(s.element)"
                      :src="$store.sim.elementIcon(s.element)"
                      :title="$store.sim.elementLabel(s.element)"
                      :alt="$store.sim.elementLabel(s.element)">
                    <!-- 武器：悬停 / 聚焦显示武器参数提示（shot_detail 基础值） -->
                    <span class="hex-chip hex-chip--dark hex-chip--weapon has-tip" tabindex="0"
                      :aria-label="s.weaponType" aria-describedby="weaponTip">
                      <img :src="$store.sim.weaponIcon(s.weaponType)" alt="">
                      <span class="chip-tip" id="weaponTip" role="tooltip">
                        <span class="chip-tip-title" x-text="s.weaponType"></span>
                        <template x-for="r in $store.sim.weaponTipRows(s)" :key="r.label">
                          <span class="chip-tip-row">
                            <span class="chip-tip-k" x-text="r.label"></span>
                            <span class="chip-tip-v mono" x-text="r.value"></span>
                          </span>
                        </template>
                        <span class="chip-tip-row chip-tip-k" x-show="!$store.sim.weaponTipRows(s).length"
                          x-text="$t('slot.loading')"></span>
                      </span>
                    </span>
                    <span class="hex-chip hex-chip--light" role="img"
                      :title="$store.sim.classLabel(s.classType)"
                      :aria-label="$store.sim.classLabel(s.classType)">
                      <img :src="$store.sim.classIcon(s.classType)" alt="">
                    </span>
                    <span class="hex-chip hex-chip--light" role="img" x-show="$store.sim.corpIcon(s.corporation)"
                      :title="$store.sim.corpLabel(s.corporation)"
                      :aria-label="$store.sim.corpLabel(s.corporation)">
                      <img class="corp-img" :src="$store.sim.corpIcon(s.corporation)" alt="">
                    </span>
                    <label class="bond-chip"
                      :title="$t('slot.bond') + ' · ' + $t('slot.bondMax', { n: $store.sim.maxBond(s.grade, s.corporation) })">
                      <img src="src/assets/icons/love.png" alt="">
                      <input class="bond-input mono" type="number" min="1"
                        :aria-label="$t('slot.bond')"
                        :max="$store.sim.maxBond(s.grade, s.corporation)"
                        x-model.number="s.bondLevel"
                        @change="$store.sim.clampBond($store.sim.activeSlot)">
                    </label>
                    <!-- 不用 x-show：Alpine 3.14 的 x-show 显隐经 rAF 延迟，_loading 同帧内多次翻转时会残留显示；:class 同步生效 -->
                    <span class="tag tag-dim" :class="{ hidden: !s._loading }" x-text="$t('slot.loading')"></span>
                    <!-- 极限突破：三颗星，点第 n 颗点亮前 n 颗；点已点亮的星退到 n-1 -->
                    <div class="grade-stars" role="group" :aria-label="$t('slot.grade')" :title="$t('slot.grade')">
                      <template x-for="n in [1,2,3]" :key="n">
                        <button type="button" class="grade-star"
                          :class="{ 'grade-star--on': s.grade >= n }"
                          :aria-pressed="s.grade >= n"
                          :aria-label="$t('slot.grade') + ' ' + n"
                          @click="$store.sim.clickGradeStar($store.sim.activeSlot, n)">
                          <img src="src/assets/icons/star-gold.png" alt="">
                        </button>
                      </template>
                    </div>
                    <!-- 核心加强：数字输入框叠在极限突破背景图上 -->
                    <span class="evolve-badge"
                      :class="{ 'evolve-badge--off': s.grade < 3 }"
                      :title="$t('slot.core') + ' · ' + (s.grade < 3 ? $t('slot.coreLocked') : $t('slot.coreTip'))">
                      <input class="evolve-input mono" type="number" min="0" max="7"
                        :aria-label="$t('slot.core')"
                        :disabled="s.grade < 3"
                        x-model.number="s.core"
                        @change="$store.sim.clampCore($store.sim.activeSlot)">
                    </span>
                  </div>
                </div>
                <div class="char-actions">
                  <button class="btn btn-ghost btn-sm"
                    @click="$store.sim.openCharPicker($store.sim.activeSlot)" x-text="$t('slot.change')"></button>
                  <button class="btn btn-ghost btn-sm"
                    @click="$store.sim.clearSlot($store.sim.activeSlot)" x-text="$t('slot.clear')"></button>
                </div>
              </div>

              <!-- 最终属性 -->
              <section class="card"
                x-data="{ get stats() { return $store.sim.computedStats($store.sim.activeSlot); } }">
                <h3 class="sub-title" x-text="$t('stats.title')"></h3>
                <template x-if="stats">
                  <div>
                    <div class="stats-grid">
                      <div class="stat-item">
                        <img class="stat-icon" src="src/assets/icons/stat-hp.png" alt="">
                        <span class="stat-label">HP</span>
                        <span class="stat-value" x-text="$store.sim.fmtStat(stats.hp)"></span>
                      </div>
                      <div class="stat-item">
                        <img class="stat-icon" src="src/assets/icons/stat-atk.png" alt="">
                        <span class="stat-label">ATK</span>
                        <span class="stat-value"
                          x-text="$store.sim.fmtStat(stats.atk)"
                          :title="stats.equipAtkPct > 0 ? $t('stats.atkTip', { pct: (stats.equipAtkPct * 100).toFixed(2) + '%' }) : ''">
                        </span>
                      </div>
                      <div class="stat-item">
                        <img class="stat-icon" src="src/assets/icons/stat-def.png" alt="">
                        <span class="stat-label">DEF</span>
                        <span class="stat-value" x-text="$store.sim.fmtStat(stats.def)"></span>
                      </div>
                    </div>
                    <div class="stats-extras">
                      <template x-if="stats.equipElementDmgPct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.elementDmgPct')"></span> +<b x-text="$store.sim.fmtPct(stats.equipElementDmgPct)"></b></span>
                      </template>
                      <template x-if="stats.hitRatePct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.hitRatePct')"></span> +<b x-text="$store.sim.fmtPct(stats.hitRatePct)"></b></span>
                      </template>
                      <template x-if="stats.equipMaxAmmoPct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.equipMaxAmmoPct')"></span> +<b x-text="$store.sim.fmtPct(stats.equipMaxAmmoPct)"></b></span>
                      </template>
                      <template x-if="stats.equipAtkPct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.atkPct')"></span> +<b x-text="$store.sim.fmtPct(stats.equipAtkPct)"></b></span>
                      </template>
                      <template x-if="stats.equipAtkFlat > 0">
                        <span class="stat-badge"><span x-text="$t('stats.atkFlat')"></span> +<b x-text="$store.sim.fmtStat(stats.equipAtkFlat)"></b></span>
                      </template>
                      <template x-if="stats.chargeDmgPct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.chargeDmgPct')"></span> +<b x-text="$store.sim.fmtPct(stats.chargeDmgPct)"></b></span>
                      </template>
                      <template x-if="stats.chargeSpeedPct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.chargeSpeedPct')"></span> +<b x-text="$store.sim.fmtPct(stats.chargeSpeedPct)"></b></span>
                      </template>
                      <template x-if="stats.critRate > 0.15">
                        <span class="stat-badge"><span x-text="$t('equipOpt.critRatePct')"></span> +<b x-text="$store.sim.fmtPct(stats.critRate - 0.15)"></b></span>
                      </template>
                      <template x-if="stats.critDmg > 0.50">
                        <span class="stat-badge"><span x-text="$t('equipOpt.critDamagePct')"></span> +<b x-text="$store.sim.fmtPct(stats.critDmg - 0.50)"></b></span>
                      </template>
                      <template x-if="stats.equipDefPct > 0">
                        <span class="stat-badge"><span x-text="$t('equipOpt.defFlat')"></span> +<b x-text="$store.sim.fmtPct(stats.equipDefPct)"></b></span>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!stats">
                  <p class="hint" x-text="$t('stats.pending')"></p>
                </template>
              </section>

              <!-- 技能 -->
              <section class="card">
                <div class="section-toggle" @click="showSkills = !showSkills">
                  <h3 class="sub-title" x-text="$t('skills.title')"></h3>
                  <span class="toggle-icon" x-text="showSkills ? '▲' : '▼'"></span>
                </div>
                <div x-show="showSkills">
                  <template x-for="j in [0,1,2]" :key="j">
                    <div class="skill-row">
                      <div class="skill-meta">
                        <span class="skill-name-row"
                          x-show="!!$store.sim.activeSlotData._nikkeData"
                          x-text="$store.sim.effectiveSkillDetail($store.sim.activeSlot, j)?.name_localkey ?? ''"></span>
                        <!-- 主动技能 / 爆裂技能冷却（时钟图标 + N.0s）：NaN = 主动技能但冷却未登记 -->
                        <span class="skill-cd"
                          x-data="{ get cd() { return $store.sim.skillCooldownSec($store.sim.activeSlot, j) } }"
                          x-show="cd != null"
                          :title="Number.isNaN(cd) ? $t('skills.activeNoCdTitle') : $t('skills.cooldownTitle')">
                          <svg class="skill-cd-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <circle cx="10" cy="10" r="10" fill="#585859"></circle>
                            <path d="M10 5V10L15 14" stroke="white" stroke-width="2"></path>
                          </svg>
                          <span class="skill-cd-val mono"
                            x-text="Number.isNaN(cd) ? $t('skills.active') : (+cd).toFixed(1) + 's'"></span>
                        </span>
                        <div class="skill-lv-ctrl">
                          <button class="lv-btn"
                            @click="if ($store.sim.activeSlotData.skills[j] > 1) $store.sim.activeSlotData.skills[j]--">−</button>
                          <span class="skill-lv-num" x-text="'Lv ' + $store.sim.activeSlotData.skills[j]"></span>
                          <button class="lv-btn"
                            @click="if ($store.sim.activeSlotData.skills[j] < 10) $store.sim.activeSlotData.skills[j]++">+</button>
                        </div>
                      </div>
                      <template x-if="$store.sim.activeSlotData._nikkeData">
                        <p class="skill-desc"
                          x-html="$store.sim.renderSkillHtml(
                            $store.sim.effectiveSkillDetail($store.sim.activeSlot, j),
                            $store.sim.activeSlotData.skills[j]
                          )">
                        </p>
                      </template>
                    </div>
                  </template>
                </div>
              </section>

              <!-- 装备 -->
              <section class="card">
                <div class="section-toggle" @click="showEquip = !showEquip">
                  <h3 class="sub-title" x-text="$t('equip.title')"></h3>
                  <span class="toggle-icon" x-text="showEquip ? '▲' : '▼'"></span>
                </div>
                <div x-show="showEquip">
                  <template x-for="key in $store.sim.EQUIP_SLOTS" :key="key">
                    <div class="equip-block">
                      <div class="equip-header">
                        <span class="equip-slot-label" x-text="$t('equip.slot.' + key)"></span>
                        <div class="row-inline">
                          <span class="field-hint" x-text="$t('equip.tier')"></span>
                          <select class="input input-sm"
                            :value="$store.sim.activeSlotData.equipment[key].tier"
                            @change="$store.sim.activeSlotData.equipment[key].tier = $event.target.value">
                            <template x-for="tier in $store.sim.EQUIP_TIERS" :key="tier">
                              <option :value="tier" :selected="tier === $store.sim.activeSlotData.equipment[key].tier" x-text="$t('equip.tierName.' + tier)"></option>
                            </template>
                          </select>
                          <span class="field-hint" x-text="$t('equip.level')"></span>
                          <select class="input input-sm"
                            :value="$store.sim.activeSlotData.equipment[key].level"
                            @change="$store.sim.activeSlotData.equipment[key].level = +$event.target.value">
                            <template x-for="lv in [0,1,2,3,4,5]" :key="lv">
                              <option :value="lv" :selected="lv === $store.sim.activeSlotData.equipment[key].level" x-text="lv"></option>
                            </template>
                          </select>
                        </div>
                      </div>
                      <!-- 仅 T10 装备有词条；T9 / T9企业时屏蔽 -->
                      <div class="equip-opts" x-show="$store.sim.equipHasOptions($store.sim.activeSlotData.equipment[key].tier)">
                        <template x-for="(opt, oi) in $store.sim.activeSlotData.equipment[key].opts" :key="oi">
                          <div class="opt-row">
                            <!-- 选项文案随界面语言变化：x-effect 重建 option 后恢复当前选中值 -->
                            <select class="input input-sm opt-type"
                              x-effect="$el.innerHTML = $store.sim.equipTypeOptions(); $el.value = opt.type"
                              x-model="opt.type"></select>
                            <select class="input input-sm opt-val"
                              x-show="opt.type && $store.sim.EQUIP_OPTION_TYPES.find(t => t.key === opt.type)?.vals?.length"
                              x-effect="$el.innerHTML = $store.sim.equipValOptions(opt.type); $el.value = opt.value"
                              @change="opt.value = parseFloat($event.target.value) || 0"></select>
                            <input class="input input-sm opt-val"
                              x-show="opt.type && !$store.sim.EQUIP_OPTION_TYPES.find(t => t.key === opt.type)?.vals?.length"
                              x-model.number="opt.value"
                              type="number" min="0" step="1" :placeholder="$t('equip.value')">
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </section>

              <!-- 和谐魔方 -->
              <section class="card">
                <div class="section-toggle" @click="showCube = !showCube">
                  <h3 class="sub-title" x-text="$t('cube.title')"></h3>
                  <span class="toggle-icon" x-text="showCube ? '▲' : '▼'"></span>
                </div>
                <div x-show="showCube">
                  <div class="row-2">
                    <div class="field-group">
                      <label class="field-label" x-text="$t('cube.label')"></label>
                      <select class="input"
                        @change="$store.sim.activeSlotData.cube.resourceId = +$event.target.value || null; $store.sim.onCubeChange($store.sim.activeSlot)">
                        <option value="" :selected="!$store.sim.activeSlotData.cube.resourceId" x-text="$t('common.none')"></option>
                        <template x-for="c in $store.sim.cubeOptions" :key="c.id">
                          <option :value="c.id" :selected="c.id === $store.sim.activeSlotData.cube.resourceId" x-text="$store.sim.cubeName(c.id)"></option>
                        </template>
                      </select>
                    </div>
                    <div class="field-group">
                      <label class="field-label" x-text="$t('cube.level')"></label>
                      <input class="input" type="number" min="1" max="15"
                        x-model.number="$store.sim.activeSlotData.cube.level">
                    </div>
                  </div>
                  <template x-if="$store.sim.activeSlotData._cubeData">
                    <div class="cube-skill-wrap"
                      x-html="$store.sim.cubeSkillHtml($store.sim.activeSlot)">
                    </div>
                  </template>
                </div>
              </section>

              <!-- 珍藏品 -->
              <section class="card">
                <div class="section-toggle" @click="showFav = !showFav">
                  <h3 class="sub-title" x-text="$t('fav.title')"></h3>
                  <span class="toggle-icon" x-text="showFav ? '▲' : '▼'"></span>
                </div>
                <div x-show="showFav">
                  <div class="row-2">
                    <div class="field-group">
                      <label class="field-label" x-text="$t('fav.item')"></label>
                      <select class="input"
                        @change="$store.sim.activeSlotData.favoriteItem.resourceId = +$event.target.value || null; $store.sim.onFavChange($store.sim.activeSlot)">
                        <option value="" :selected="!$store.sim.activeSlotData.favoriteItem.resourceId" x-text="$t('common.none')"></option>
                        <template x-for="f in $store.sim.favItemsForSlot($store.sim.activeSlot)" :key="f.id">
                          <option :value="f.id" :selected="f.id === $store.sim.activeSlotData.favoriteItem.resourceId" x-text="$store.sim.favItemLabel(f)"></option>
                        </template>
                      </select>
                    </div>
                    <div class="field-group" x-show="($store.sim.activeSlotData.favoriteItem.resourceId ?? 0) < 200000">
                      <label class="field-label" x-text="$t('fav.level')"></label>
                      <input class="input" type="number" min="0" max="15"
                        x-model.number="$store.sim.activeSlotData.favoriteItem.level">
                    </div>
                    <div class="field-group" x-show="($store.sim.activeSlotData.favoriteItem.resourceId ?? 0) >= 200000">
                      <label class="field-label" x-text="$t('fav.levelSsr')"></label>
                      <select class="input" x-model.number="$store.sim.activeSlotData.favoriteItem.level">
                        <option :value="0">Lv5</option>
                        <option :value="1">Lv10</option>
                        <option :value="2">Lv15</option>
                      </select>
                    </div>
                  </div>
                  <template x-if="$store.sim.activeSlotData._favData">
                    <div class="fav-skill-wrap"
                      x-html="$store.sim.favSkillHtml($store.sim.activeSlot)">
                    </div>
                  </template>
                </div>
              </section>

            </div>
          </template>
        </div>
      </div>

      <!-- ╔══ 右栏：结果 ══╗ -->
      <aside class="panel panel-right">

          <template x-if="!$store.sim.result && !$store.sim.simRunning">
            <div class="empty-result">
              <p x-html="$t('results.empty')"></p>
            </div>
          </template>

          <template x-if="$store.sim.simRunning">
            <div class="empty-result sim-running">
              <p><span x-text="$t('results.running')"></span>
                <span class="sim-progress mono" x-show="$store.sim.simProgress.total > 0"
                  x-text="$store.sim.simProgress.done + ' / ' + $store.sim.simProgress.total"></span>
              </p>
              <div class="sim-progress-bar" x-show="$store.sim.simProgress.total > 0">
                <div class="sim-progress-fill"
                  :style="'transform: scaleX(' + ($store.sim.simProgress.done / Math.max(1, $store.sim.simProgress.total)) + ')'"></div>
              </div>
              <button class="btn btn-sm btn-ghost" @click="$store.sim.cancelSimulate()" x-text="$t('common.cancel')"></button>
            </div>
          </template>

          <template x-if="$store.sim.result && !$store.sim.simRunning">
            <div class="result-panel">

              <!-- 固定区域：结果 + 技能伤害 -->
              <div class="result-panel-fixed">

                <!-- 结果：总览 + 各角色伤害（同一卡片） -->
                <section class="card">
                  <h2 class="card-title">
                    <span x-text="$t('results.title')"></span>
                    <span class="card-subtitle" x-text="$t('results.avg', { n: $store.sim.result.iterations })"></span>
                  </h2>
                  <div class="result-summary">
                    <div class="result-kv">
                      <span class="result-label" x-text="$t('results.totalDamage')"></span>
                      <span class="result-value result-value--main"
                        x-text="$store.sim.fmtNum($store.sim.result.totalDamage ?? 0)"></span>
                    </div>

                    <div class="result-kv">
                      <span class="result-label" x-text="$t('results.fbCount')"></span>
                      <span class="result-value"
                        x-text="Math.round($store.sim.result.burstCount ?? 0)"></span>
                    </div>
                  </div>

                  <!-- 各角色伤害 -->
                  <div class="result-units">
                  <template x-for="unit in $store.sim.result.units" :key="unit.id">
                    <div class="unit-block">
                      <div class="unit-header">
                        <span class="unit-name" x-text="$store.sim.dispText(unit.name)"></span>
                        <span class="unit-total" x-text="$store.sim.fmtNum(unit.totalDamage)"></span>
                      </div>

                      <div class="skill-breakdown">
                        <template x-for="row in $store.sim.skillDamageRows(unit)" :key="row.skillKey">
                          <div class="skill-dmg-row">
                            <span class="skill-dmg-label log-label--tip"
                              @mouseenter="$store.sim.showSkillTooltip($event, row)"
                              @mouseleave="$store.sim.hideSkillTooltip()"
                              x-text="$store.sim.dispText(row.label)"></span>
                            <div class="share-bar share-bar--sm">
                              <div class="share-fill"
                                :style="'width:' + (row.share * 100).toFixed(1) + '%'">
                              </div>
                            </div>
                            <span class="skill-dmg-count" x-show="row.count > 0"
                              x-text="'×' + Math.round(row.count)"></span>
                            <span class="skill-dmg-val" x-text="$store.sim.fmtNum(row.damage)"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                  </div><!-- /result-units -->
                </section>

              </div><!-- /result-panel-fixed -->

              <!-- 可压缩区域：战斗日志 -->
              <div class="result-panel-log">
                <section class="card card--log">
                  <div class="log-header">
                    <h3 class="sub-title" style="white-space:nowrap" x-text="$t('log.title')"></h3>
                    <div class="log-filters" x-show="$store.sim.hitLogRows.length > 0">

                      <!-- 下拉菜单1：角色 -->
                      <div class="log-dropdown" x-data="{ open: false }" @click.outside="open = false">
                        <button class="log-dropdown-btn"
                          :class="$store.sim.logHiddenUnits.length ? 'log-dropdown-btn--active' : ''"
                          @click="open = !open">
                          <span x-text="$t('log.units')"></span><span class="dd-caret" x-text="open ? ' ▲' : ' ▼'"></span>
                        </button>
                        <div class="log-dropdown-menu" x-show="open" x-cloak>
                          <template x-for="name in $store.sim.logUnitNames()" :key="name">
                            <label class="log-dropdown-item">
                              <input type="checkbox"
                                :checked="!$store.sim.logHiddenUnits.includes(name)"
                                @change="$store.sim.toggleLogUnit(name)">
                              <span x-text="$store.sim.dispText(name)"></span>
                            </label>
                          </template>
                        </div>
                      </div>

                      <!-- 下拉菜单2：技能 -->
                      <div class="log-dropdown" x-data="{ open: false, menuMaxH: '60vh' }" @click.outside="open = false">
                        <button class="log-dropdown-btn"
                          :class="($store.sim.showLogNormal || $store.sim.showLogReload || $store.sim.logHiddenSkillLabels.length) ? 'log-dropdown-btn--active' : ''"
                          @click="open = !open; if(open){ const r=$el.getBoundingClientRect(); menuMaxH=Math.max(120, window.innerHeight-r.bottom-12)+'px'; }">
                          <span x-text="$t('log.skills')"></span><span class="dd-caret" x-text="open ? ' ▲' : ' ▼'"></span>
                        </button>
                        <div class="log-dropdown-menu log-dropdown-menu--scrollable" x-show="open" x-cloak
                          :style="'max-height:' + menuMaxH">
                          <label class="log-dropdown-item">
                            <input type="checkbox"
                              :checked="$store.sim.showLogNormal"
                              @change="$store.sim.showLogNormal = !$store.sim.showLogNormal">
                            <span x-text="$t('log.normal')"></span>
                          </label>
                          <label class="log-dropdown-item">
                            <input type="checkbox"
                              :checked="$store.sim.showLogReload"
                              @change="$store.sim.showLogReload = !$store.sim.showLogReload">
                            <span x-text="$t('log.reload')"></span>
                          </label>
                          <hr class="log-dropdown-sep">
                          <template x-for="label in $store.sim.logAllSkillLabels()" :key="label">
                            <label class="log-dropdown-item">
                              <input type="checkbox"
                                :checked="!$store.sim.logHiddenSkillLabels.includes(label)"
                                @change="$store.sim.toggleLogSkill(label)">
                              <span x-text="$store.sim.dispText(label)"></span>
                            </label>
                          </template>
                        </div>
                      </div>

                      <!-- 下拉菜单3：Buff 轨道 -->
                      <div class="log-dropdown" x-data="{ open: false, menuMaxH: '60vh' }" @click.outside="open = false">
                        <button class="log-dropdown-btn"
                          :class="$store.sim.logActiveBuffTracks.length ? 'log-dropdown-btn--active' : ''"
                          @click="open = !open; if(open){ const r=$el.getBoundingClientRect(); menuMaxH=Math.max(120, window.innerHeight-r.bottom-12)+'px'; }">
                          <span x-text="$t('log.buffTracks')"></span>
                          <span x-show="$store.sim.logActiveBuffTracks.length" x-text="'(' + $store.sim.logActiveBuffTracks.length + ')'"></span>
                          <span class="dd-caret" x-text="open ? ' ▲' : ' ▼'"></span>
                        </button>
                        <div class="log-dropdown-menu log-dropdown-menu--scrollable" x-show="open" x-cloak
                          :style="'max-height:' + menuMaxH">
                          <template x-for="bname in $store.sim.logAllBuffNames()" :key="bname">
                            <label class="log-dropdown-item">
                              <span class="buff-track-dot"
                                :style="$store.sim.logActiveBuffTracks.includes(bname)
                                  ? 'background:' + $store.sim.buffTrackColorFor(bname) + ';border-color:' + $store.sim.buffTrackColorFor(bname)
                                  : ''"></span>
                              <input type="checkbox"
                                :checked="$store.sim.logActiveBuffTracks.includes(bname)"
                                @change="$store.sim.toggleBuffTrack(bname)">
                              <span x-text="$store.sim.dispText(bname)"></span>
                            </label>
                          </template>
                        </div>
                      </div>

                    </div>
                    <div class="log-mode-btns">
                      <button class="btn btn-sm"
                        :class="$store.sim.logMode === 'aggregate' ? 'btn-primary' : 'btn-ghost'"
                        @click="$store.sim.setLogMode('aggregate')" x-text="$t('log.aggregate')"></button>
                      <button class="btn btn-sm"
                        :class="$store.sim.logMode === 'detail' ? 'btn-primary' : 'btn-ghost'"
                        @click="$store.sim.setLogMode('detail')" x-text="$t('log.detail')"></button>
                    </div>
                  </div>
                  <div class="log-table-wrap" x-ref="logTableWrap">
                    <table class="log-table">
                      <thead>
                        <tr>
                          <!-- Full Burst 轨道列 -->
                          <th class="log-track-hd" title="Full Burst"></th>
                          <!-- Buff 轨道列（动态） -->
                          <template x-for="bname in $store.sim.logActiveBuffTracks" :key="'h-' + bname">
                            <th class="log-track-hd" :title="$store.sim.dispText(bname)"
                              :style="'border-bottom: 2px solid ' + $store.sim.buffTrackColorFor(bname)"></th>
                          </template>
                          <th class="log-line-hd">#</th>
                          <th x-text="$t('log.col.time')"></th>
                          <th x-text="$t('log.col.caster')"></th>
                          <th x-text="$t('log.col.skill')"></th>
                          <th x-text="$t('log.col.target')"></th>
                          <th class="log-buff-hd" x-text="$t('log.col.buff')"></th>
                          <th style="text-align:right" x-text="$t('log.col.damage')"></th>
                          <th x-show="$store.sim.logMode === 'detail'" style="text-align:right" x-text="$t('log.col.ammo')"></th>
                          <th x-show="$store.sim.logMode === 'detail'" style="text-align:right" x-text="$t('log.col.gauge')"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(row, ri) in $store.sim.pagedLogRows()" :key="ri">
                          <tr :class="row.kind === 'event' ? 'log-row--event log-row--ev-' + row.eventType + (row.isDamage ? ' log-row--ev-skill-damage' : '') : ''">
                            <!-- Full Burst 轨道格 -->
                            <td class="log-track" :class="row.inFullBurst ? 'log-track--fb' : ''"></td>
                            <!-- Buff 轨道格（动态） -->
                            <template x-for="bname in $store.sim.logActiveBuffTracks" :key="'t-' + bname">
                              <td class="log-track"
                                :style="$store.sim.rowHasBuffTrack(row, bname) ? 'background:' + $store.sim.buffTrackColorFor(bname) : ''"></td>
                            </template>
                            <td class="log-line" x-text="$store.sim.logPageOffset() + ri + 1"></td>
                            <td class="log-time mono" x-text="$store.sim.formatLogTime(row)"></td>
                            <td x-text="$store.sim.dispText(row.name)"></td>
                            <td class="log-label log-label--tip"
                              @mouseenter="$store.sim.showSkillTooltip($event, row)"
                              @mouseleave="$store.sim.hideSkillTooltip()">
                              <span x-text="$store.sim.dispText(row.label)"></span>
                              <span class="log-count" x-show="row.count > 1" x-text="'×' + row.count"></span>
                            </td>
                            <!-- 多目标按「、」拆分：名字内部不断行、名字之间可换行，列宽收缩到最长的单个名字 -->
                            <td class="log-target">
                              <template x-for="(tg, ti) in (row.target ? row.target.split('、') : [])" :key="ti">
                                <span class="log-target-item" x-text="$store.sim.dispText(tg)"></span>
                              </template>
                            </td>
                            <td class="log-buff">
                              <span class="hit-tag hit-tag--crit"
                                x-show="row._hit && row.isCrit" x-text="$t('log.tag.crit')"></span>
                              <span class="hit-tag hit-tag--core"
                                x-show="row._hit && row.isCore" x-text="$t('log.tag.core')"></span>
                              <span class="hit-tag hit-tag--parts"
                                x-show="row._hit && row.isParts" x-text="$t('log.tag.parts')"></span>
                              <span class="hit-tag hit-tag--dist"
                                x-show="row._hit && row.distanceAdv" x-text="$t('log.tag.dist')"></span>
                              <!-- 攻击属性：决定哪类「X 伤害 ▲」buff 生效 -->
                              <span class="hit-tag hit-tag--pierce"
                                x-show="row._hit?.isPierce" x-text="$t('log.tag.pierce')"></span>
                              <span class="hit-tag hit-tag--seq"
                                x-show="row._hit?.isSequentialAttack" x-text="$t('log.tag.seq')"></span>
                              <span class="hit-tag hit-tag--sustained"
                                x-show="row._hit?.isSustained" x-text="$t('log.tag.sustained')"></span>
                              <span class="hit-tag hit-tag--true"
                                x-show="row._hit?.isTrueDamage" x-text="$t('log.tag.true')"></span>
                              <span class="hit-tag hit-tag--explosive"
                                x-show="row._hit?.isExplosive || row._hit?.projectileExplosion" x-text="$t('log.tag.explosive')"></span>
                              <span class="hit-tag hit-tag--distributed"
                                x-show="row._hit?.isDistributed" x-text="$t('log.tag.distributed')"></span>
                              <template x-for="(buff, bi) in (row.buffArr ?? [])" :key="bi">
                                <span class="buff-tag"
                                  @mouseenter="$store.sim.showBuffTooltip($event, buff)"
                                  @mouseleave="$store.sim.hideBuffTooltip()"
                                  @click="$store.sim.toggleBuffTrack(buff.name)"
                                  :style="$store.sim.logActiveBuffTracks.includes(buff.name)
                                    ? 'text-decoration:none;border-bottom:2px solid ' + $store.sim.buffTrackColorFor(buff.name)
                                    : ''"
                                  x-text="(bi > 0 ? ' / ' : '') + $store.sim.dispText(buff.name)"></span>
                              </template>
                              <span x-show="!(row.buffArr && row.buffArr.length)" x-text="$store.sim.dispText(row.buffDesc)"></span>
                            </td>
                            <td class="log-dmg mono"
                              :class="$store.sim.logMode === 'detail' && row._hit ? 'log-dmg--tip' : ''"
                              x-text="row.damage != null ? $store.sim.fmtNum(row.damage) : ''"
                              @mouseenter="$store.sim.logMode === 'detail' && row._hit && $store.sim.showDmgTooltip($event, row._hit)"
                              @mouseleave="$store.sim.hideDmgTooltip()"
                              @click="$store.sim.logMode === 'detail' && row._hit && $store.sim.copyDmgFormula(row._hit)"></td>
                            <td class="log-ammo mono" x-show="$store.sim.logMode === 'detail'"
                              x-text="row.charge ?? ''"></td>
                            <td class="log-gauge mono"
                              :class="row.gaugeAdded != null ? 'log-gauge--tip' : ''"
                              x-show="$store.sim.logMode === 'detail'"
                              x-text="$store.sim.fmtGaugeAdded(row)"
                              @mouseenter="row.gaugeAdded != null && $store.sim.showGaugeTooltip($event, row)"
                              @mouseleave="$store.sim.hideGaugeTooltip()"></td>
                          </tr>
                        </template>
                        <template x-if="!$store.sim.hitLogRows.length">
                          <tr><td colspan="99" class="log-empty" x-text="$t('log.empty')"></td></tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                  <!-- 日志分页：一次只渲染一页，控制 DOM 与 Alpine 绑定数量 -->
                  <nav class="log-pager" :aria-label="$t('log.pager')" x-show="$store.sim.logPageCount() > 1">
                    <button class="btn btn-sm btn-ghost" :aria-label="$t('log.firstPage')"
                      :disabled="$store.sim.logPageOffset() === 0"
                      @click="$store.sim.setLogPage(0); $refs.logTableWrap.scrollTop = 0">«</button>
                    <button class="btn btn-sm btn-ghost"
                      :disabled="$store.sim.logPageOffset() === 0"
                      @click="$store.sim.setLogPage($store.sim._clampedLogPage() - 1); $refs.logTableWrap.scrollTop = 0"
                      x-text="$t('log.prevPage')"></button>
                    <span class="log-pager-info mono"
                      x-text="$t('log.pageInfo', { p: $store.sim._clampedLogPage() + 1, n: $store.sim.logPageCount(), rows: $store.sim.filteredLogRows().length })"></span>
                    <button class="btn btn-sm btn-ghost"
                      :disabled="$store.sim._clampedLogPage() >= $store.sim.logPageCount() - 1"
                      @click="$store.sim.setLogPage($store.sim._clampedLogPage() + 1); $refs.logTableWrap.scrollTop = 0"
                      x-text="$t('log.nextPage')"></button>
                    <button class="btn btn-sm btn-ghost" :aria-label="$t('log.lastPage')"
                      :disabled="$store.sim._clampedLogPage() >= $store.sim.logPageCount() - 1"
                      @click="$store.sim.setLogPage($store.sim.logPageCount() - 1); $refs.logTableWrap.scrollTop = 0">»</button>
                  </nav>
                </section>
              </div><!-- /result-panel-log -->

            </div>
          </template>

      </aside>

    </div><!-- /layout -->

  </div><!-- /app -->

  <!-- ── 角色选择器弹窗 ──────────────────────────────────────── -->
  <div class="modal-overlay"
       x-data
       x-show="$store.sim.charPickerSlot >= 0"
       x-transition.opacity
       @click.self="$store.sim.closeCharPicker()"
       style="display:none">
    <div class="modal-box modal-box--picker" @click.stop>
      <div class="modal-header">
        <h2 class="modal-title" x-text="$t('picker.title')"></h2>
        <button class="btn btn-ghost btn-sm" @click="$store.sim.closeCharPicker()">✕</button>
      </div>
      <!-- 搜索框 + 图标筛选（组内多选为「或」，组间为「且」；组内全不选 = 不筛选该组） -->
      <div class="picker-toolbar">
        <input class="input modal-search" type="text"
          :placeholder="$t('picker.search')"
          x-model="$store.sim.charQuery">
        <template x-for="g in $store.sim.CHAR_FILTER_GROUPS" :key="g.key">
          <div class="picker-filter-group" role="group" :aria-label="$t('picker.filter.' + g.key)">
            <template x-for="v in g.values" :key="v">
              <button type="button" class="picker-filter"
                :class="{ 'picker-filter--on': $store.sim.charFilters[g.key].includes(v) }"
                :aria-pressed="$store.sim.charFilters[g.key].includes(v)"
                :title="$store.sim.charFilterLabel(g.key, v)"
                :aria-label="$store.sim.charFilterLabel(g.key, v)"
                @click="$store.sim.toggleCharFilter(g.key, v)">
                <img x-show="g.key === 'element'" class="code-chip"
                  :src="$store.sim.charFilterIcon(g.key, v)" alt="">
                <span x-show="g.key !== 'element'" class="hex-chip"
                  :class="{
                    'hex-chip--dark':   g.key === 'burstStep' || g.key === 'weaponType',
                    'hex-chip--light':  g.key === 'classType' || g.key === 'corporation',
                    'hex-chip--weapon': g.key === 'weaponType',
                  }">
                  <img :class="{ 'corp-img': g.key === 'corporation' }"
                    :src="$store.sim.charFilterIcon(g.key, v)" alt="">
                </span>
              </button>
            </template>
          </div>
        </template>
      </div>
      <div class="char-grid">
        <template x-for="char in $store.sim.filteredChars" :key="char.resourceId">
          <button class="char-card"
            :class="{ 'char-card--unmodeled': !char.modeled }"
            :disabled="!char.modeled"
            :title="char.modeled ? $store.sim.charName(char.resourceId, char.name) : $t('picker.unmodeled', { name: $store.sim.charName(char.resourceId, char.name) })"
            @click="$store.sim.selectChar(char.resourceId)">
            <img class="char-card-img"
              :src="`src/data/static/images/sm/${String(char.resourceId).padStart(3,'0')}_00.webp`"
              :alt="$store.sim.charName(char.resourceId, char.name)"
              @error="$el.style.display='none'">
            <span class="char-card-name" x-text="$store.sim.charName(char.resourceId, char.name)"></span>
          </button>
        </template>
      </div>
    </div>
  </div>

  <!-- ── 敌人配置导入 / 导出弹窗（两种模式共用，仅按钮与拖入文件不同） ── -->
  <div class="modal-overlay"
       x-data
       x-show="$store.sim.enemyIo.mode"
       x-transition.opacity
       @click.self="$store.sim.closeEnemyIo()"
       @keydown.escape.window="$store.sim.enemyIo.mode && $store.sim.closeEnemyIo()"
       @dragover.prevent
       @drop.prevent
       x-effect="if ($store.sim.enemyIo.mode) $nextTick(() => {
         $refs.ioText.focus();
         if ($store.sim.enemyIo.mode === 'export') { $refs.ioText.select(); $refs.ioText.scrollTop = 0; }
       })"
       style="display:none">
    <div class="modal-box modal-box--io" role="dialog" aria-modal="true" aria-labelledby="enemy-io-title" @click.stop>
      <div class="modal-header">
        <h2 class="modal-title" id="enemy-io-title"
          x-text="$t($store.sim.enemyIo.mode === 'export' ? 'enemyIo.modal.exportTitle' : 'enemyIo.modal.importTitle')"></h2>
        <button type="button" class="btn btn-ghost btn-sm" :title="$t('enemyIo.btn.close')"
          @click="$store.sim.closeEnemyIo()">✕</button>
      </div>

      <div class="io-body">
        <p class="io-msg" role="alert"
          x-show="$store.sim.enemyIo.message"
          :class="'io-msg--' + ($store.sim.enemyIo.message?.kind ?? 'warn')"
          x-text="$store.sim.enemyIo.message?.text"></p>

        <!-- 文本框容器：导入模式下同时作为拖放区 -->
        <div class="io-drop"
          :class="{ 'io-drop--active': $store.sim.enemyIo.dragging }"
          @dragenter.prevent="$store.sim.enemyIo.mode === 'import' && ($store.sim.enemyIo.dragging = true)"
          @dragover.prevent="$store.sim.enemyIo.mode === 'import' && ($store.sim.enemyIo.dragging = true)"
          @dragleave="if (!$el.contains($event.relatedTarget)) $store.sim.enemyIo.dragging = false"
          @drop.prevent="$store.sim.enemyIo.mode === 'import' && $store.sim.loadEnemyIoFile($event.dataTransfer.files[0])">
          <textarea class="io-text" x-ref="ioText" spellcheck="false"
            :readonly="$store.sim.enemyIo.mode === 'export'"
            :placeholder="$t('enemyIo.placeholder')"
            :aria-label="$t($store.sim.enemyIo.mode === 'export' ? 'enemyIo.modal.exportTitle' : 'enemyIo.modal.importTitle')"
            x-model="$store.sim.enemyIo.text"
            @keydown.ctrl.enter="$store.sim.enemyIo.mode === 'import' && $store.sim.submitEnemyIoImport()"></textarea>
          <div class="io-drop-hint" aria-hidden="true" x-text="$t('enemyIo.dropHint')"></div>
        </div>
      </div>

      <div class="io-footer">
        <span class="io-hint"
          x-text="$t($store.sim.enemyIo.mode === 'export' ? 'enemyIo.hint.export' : 'enemyIo.hint.import')"></span>
        <template x-if="$store.sim.enemyIo.mode === 'export'">
          <div class="io-actions">
            <button type="button" class="btn btn-ghost" @click="$store.sim.saveEnemyIoFile()"
              x-text="$t('enemyIo.btn.saveFile')"></button>
            <button type="button" class="btn btn-primary" @click="$store.sim.copyEnemyIoText()"
              x-text="$t('enemyIo.btn.copy')"></button>
          </div>
        </template>
        <template x-if="$store.sim.enemyIo.mode === 'import'">
          <div class="io-actions">
            <button type="button" class="btn btn-ghost" @click="$refs.ioFile.click()"
              x-text="$t('enemyIo.btn.chooseFile')"></button>
            <button type="button" class="btn btn-primary" @click="$store.sim.submitEnemyIoImport()"
              x-text="$t('enemyIo.btn.import')"></button>
          </div>
        </template>
        <input type="file" accept=".json,application/json" class="visually-hidden" x-ref="ioFile" tabindex="-1"
          @change="$store.sim.loadEnemyIoFile($event.target.files[0]); $event.target.value = ''">
      </div>
    </div>
  </div>

  <!-- ── 模拟记录弹窗：最近的模拟结果（队伍组成 + 各角色总伤害） ── -->
  <div class="modal-overlay"
       x-data
       x-show="$store.sim.simHistoryOpen"
       x-transition.opacity
       @click.self="$store.sim.simHistoryOpen = false"
       @keydown.escape.window="$store.sim.simHistoryOpen = false"
       style="display:none">
    <div class="modal-box modal-box--history" role="dialog" aria-modal="true" aria-labelledby="sim-history-title" @click.stop>
      <div class="modal-header">
        <h2 class="modal-title" id="sim-history-title">
          <span x-text="$t('history.title')"></span>
          <span class="hist-count mono"
            x-text="$t('history.count', { n: $store.sim.simHistory.length, max: $store.sim.SIM_HISTORY_MAX })"></span>
        </h2>
        <div class="hist-header-actions">
          <button type="button" class="btn btn-ghost btn-sm hist-clear-btn"
            x-show="$store.sim.simHistory.length"
            @click="$store.sim.clearSimHistory()" x-text="$t('history.clear')"></button>
          <button type="button" class="btn btn-ghost btn-sm" :title="$t('history.close')"
            @click="$store.sim.simHistoryOpen = false">✕</button>
        </div>
      </div>

      <p class="hist-empty" x-show="!$store.sim.simHistory.length" x-text="$t('history.empty')"></p>

      <!-- 仅在弹窗打开时渲染列表（最多 100 条 × 5 角色），关闭后释放 DOM -->
      <template x-if="$store.sim.simHistoryOpen && $store.sim.simHistory.length">
        <ol class="hist-list">
          <template x-for="rec in $store.sim.simHistory" :key="rec.id">
            <!-- 单行紧凑布局：元信息 | 总伤害 | 5 个站位格（按队伍槽位对齐，便于逐条对比） | 删除 -->
            <!-- 点击整行（或聚焦后按 Enter / 空格）应用此记录的队伍配置 -->
            <li class="hist-item" role="button" tabindex="0"
              :class="{ 'hist-item--disabled': $store.sim.simRunning }"
              :aria-disabled="$store.sim.simRunning"
              :title="$t('history.applyHint')"
              @click="$store.sim.applySimHistory(rec.id)"
              @keydown.enter.prevent="$store.sim.applySimHistory(rec.id)"
              @keydown.space.prevent="$store.sim.applySimHistory(rec.id)">
              <div class="hist-meta" :title="$store.sim.fmtHistoryTime(rec.createdAt)">
                <time class="hist-time mono" :datetime="new Date(rec.createdAt).toISOString()"
                  x-text="$store.sim.fmtHistoryTime(rec.createdAt).slice(5)"></time>
                <span class="hist-sub"
                  x-text="[rec.enemy?.element && $t('history.enemy') + ' ' + $store.sim.elementLabel(rec.enemy.element),
                           rec.level && $t('history.level', { n: rec.level })].filter(Boolean).join(' · ')"></span>
              </div>
              <span class="hist-total mono" :title="$t('results.totalDamage')"
                x-text="$store.sim.fmtNum(rec.totalDamage)"></span>

              <ol class="hist-units">
                <template x-for="(u, ui) in rec.units" :key="ui">
                  <li class="hist-unit" :style="'grid-column:' + ((u.position ?? ui) + 1)"
                    :title="$store.sim.charName(u.characterId, u.name) + (u.isFocus ? ' (' + $t('history.focus') + ')' : '')">
                    <img class="hist-unit-img" :class="{ 'hist-unit-img--focus': u.isFocus }"
                      width="64" height="64" loading="lazy"
                      :src="`src/data/static/images/sm/${String(u.characterId).padStart(3,'0')}_00.webp`"
                      :alt="$store.sim.charName(u.characterId, u.name)"
                      @error="$el.style.visibility='hidden'">
                    <span class="hist-unit-name" x-text="$store.sim.charName(u.characterId, u.name)"></span>
                    <span class="hist-unit-dmg mono" x-text="$store.sim.fmtNum(u.totalDamage)"></span>
                  </li>
                </template>
              </ol>

              <button type="button" class="hist-del-btn" :title="$t('history.delete')" :aria-label="$t('history.delete')"
                @click.stop="$store.sim.deleteSimHistory(rec.id)"
                @keydown.enter.stop @keydown.space.stop>✕</button>
            </li>
          </template>
        </ol>
      </template>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" role="status" aria-live="polite"
       x-data
       x-show="$store.sim.toast"
       x-transition.opacity.duration.200ms
       x-text="$store.sim.toast?.text"
       style="display:none"></div>

  <div id="dmg-tooltip"   class="dmg-tooltip"   style="display:none"></div>
  <div id="skill-tooltip" class="skill-tooltip" style="display:none"></div>
  <div id="buff-tooltip"  class="skill-tooltip" style="display:none"></div>
  <div id="gauge-tooltip" class="gauge-tooltip" style="display:none"></div>
  <!-- 错误弹窗：独立模块、先于 main.js 加载，主程序模块加载失败时也能捕获并弹窗 -->
  <script type="module" src="src/ui/error-report.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
