<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIKKE 战斗模拟器</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── 加载遮罩 ──────────────────────────────────────────── -->
  <div id="loader">
    <div class="loader-box">
      <div class="loader-title">⚡ NIKKE 战斗模拟器</div>
      <p id="loadProgress" class="loader-msg">正在初始化…</p>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- ── 主应用（Alpine 挂载点） ────────────────────────────── -->
  <div id="app"
       x-data
       x-init="$store.sim.init().then(() => {
         document.getElementById('loader').style.display = 'none';
         document.getElementById('app').classList.remove('hidden');
       })">

    <!-- ── 顶栏 ─────────────────────────────────────────────── -->
    <header class="topbar">
      <div class="topbar-brand">⚡ NIKKE 战斗模拟器</div>
      <div class="topbar-right">
        <span class="topbar-status" x-text="$store.sim.accountStatus"></span>
        <template x-if="$store.sim.devMode">
          <button class="btn btn-ghost btn-sm" title="重新从 dev/config.json 加载账号"
            @click="$store.sim.reloadAccountFromDev()">
            📂 导入账号
          </button>
        </template>
        <template x-if="!$store.sim.devMode">
          <label class="btn btn-ghost btn-sm" title="导入账号 JSON">
            📂 导入账号
            <input type="file" accept=".json" class="visually-hidden"
              @change="e => $store.sim.importAccount(e.target.files[0]).then(() => e.target.value = '')">
          </label>
        </template>
      </div>
    </header>

    <!-- ── 三栏布局 ──────────────────────────────────────────── -->
    <div class="layout">

      <!-- ╔══ 左栏：全局配置 ══╗ -->
      <aside class="panel panel-left">
        <div class="panel-scroll">

          <!-- 同步器与研究 -->
          <section class="card">
            <h2 class="card-title">⚙️ 全局配置</h2>
            <div class="row-2">
              <div class="field-group">
                <label class="field-label">同步器等级</label>
                <input class="input" type="number" min="1" max="1200"
                  x-model.number="$store.sim.synchroLevel">
              </div>
              <div class="field-group">
                <label class="field-label">通用研究</label>
                <input class="input" type="number" min="0" max="1200"
                  x-model.number="$store.sim.generalResearch">
              </div>
            </div>
            <div class="section-sub">职业研究</div>
            <div class="row-3">
              <template x-for="cls in ['attacker','defender','supporter']" :key="cls">
                <div class="field-group">
                  <label class="field-label" x-text="({'attacker':'火力型','defender':'防御型','supporter':'辅助型'})[cls]"></label>
                  <input class="input" type="number" min="0" max="999"
                    :value="$store.sim.classResearch[cls]"
                    @input="$store.sim.classResearch[cls] = +$event.target.value">
                </div>
              </template>
            </div>
            <div class="section-sub">厂商研究</div>
            <div class="row-3">
              <template x-for="corp in ['ELYSION','MISSILIS','TETRA','PILGRIM','ABNORMAL']" :key="corp">
                <div class="field-group">
                  <label class="field-label" x-text="$store.sim.corpLabel(corp)"></label>
                  <input class="input" type="number" min="0" max="999"
                    :value="$store.sim.corpResearch[corp]"
                    @input="$store.sim.corpResearch[corp] = +$event.target.value">
                </div>
              </template>
            </div>
          </section>

          <!-- 敌人配置 -->
          <section class="card">
            <h2 class="card-title">🎯 敌人配置</h2>
            <div class="field-group">
              <label class="field-label">代码</label>
              <select class="input" x-model="$store.sim.enemy.element">
                <option value="Fire">燃烧</option>
                <option value="Water">水冷</option>
                <option value="Wind">风压</option>
                <option value="Electric">电击</option>
                <option value="Iron">铁甲</option>
              </select>
            </div>

            <div class="section-sub mt-1">敌人行动阶段</div>
            <table class="enemy-actions-table">
              <thead>
                <tr>
                  <th>时间 (s)</th>
                  <th>类型</th>
                  <th>值</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(action, idx) in $store.sim.enemy.actions" :key="action.id">
                  <tr>
                    <td>
                      <template x-if="idx < 3">
                        <span class="action-fixed-cell">0</span>
                      </template>
                      <template x-if="idx >= 3">
                        <input class="input input-sm no-spin" type="number" min="0" max="180"
                          :value="action.startTimeS"
                          @input="$store.sim.updateEnemyAction(action.id, 'startTimeS', +$event.target.value)"
                          @blur="$store.sim.sortEnemyActions()">
                      </template>
                    </td>
                    <td>
                      <template x-if="idx < 3">
                        <span class="action-fixed-cell" x-text="({def:'DEF',core:'核心',position:'位置'})[action.type]"></span>
                      </template>
                      <template x-if="idx >= 3">
                        <select class="input input-sm"
                          :value="action.type"
                          @change="$store.sim.updateEnemyAction(action.id, 'type', $event.target.value)">
                          <option value="def">DEF</option>
                          <option value="core">核心</option>
                          <option value="position">位置</option>
                        </select>
                      </template>
                    </td>
                    <td>
                      <template x-if="action.type === 'def'">
                        <input class="input input-sm no-spin" type="number" min="0"
                          :value="action.value"
                          @input="$store.sim.updateEnemyAction(action.id, 'value', +$event.target.value)">
                      </template>
                      <template x-if="action.type === 'core'">
                        <select class="input input-sm"
                          :value="action.value"
                          @change="$store.sim.updateEnemyAction(action.id, 'value', $event.target.value)">
                          <option value="EXPOSED">暴露核心</option>
                          <option value="PROTECTED">保护核心</option>
                          <option value="NONE">无核心</option>
                        </select>
                      </template>
                      <template x-if="action.type === 'position'">
                        <select class="input input-sm"
                          :value="action.value"
                          @change="$store.sim.updateEnemyAction(action.id, 'value', $event.target.value)">
                          <option value="NEAR">近</option>
                          <option value="MID">中</option>
                          <option value="FAR">远</option>
                          <option value="HIDDEN">隐藏</option>
                        </select>
                      </template>
                    </td>
                    <td>
                      <template x-if="idx >= 3">
                        <button class="btn-icon btn-remove-action" @click="$store.sim.removeEnemyAction(action.id)" title="删除">−</button>
                      </template>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
            <button class="btn-add-action" @click="$store.sim.addEnemyAction()">＋ 添加行动</button>
          </section>

          <!-- 模拟选项 -->
          <section class="card">
            <h2 class="card-title">🎲 模拟选项</h2>
            <p class="hint">战斗时长固定 180 秒</p>
            <div class="field-group">
              <label class="field-label">迭代次数（最多 100 次）</label>
              <input class="input" type="number" min="1" max="100"
                x-model.number="$store.sim.iterations">
            </div>
            <div class="field-group">
              <label class="field-label">
                爆裂延迟
                <span class="field-hint" x-text="'（' + $store.sim.burstStepSecs.toFixed(1) + 's）'"></span>
              </label>
              <input type="range" class="input-range" min="0.1" max="0.6" step="0.1"
                x-model.number="$store.sim.burstStepSecs">
              <div class="range-labels">
                <span>0.1s</span><span>0.6s</span>
              </div>
            </div>
            <button class="btn btn-primary btn-block mt-1"
              :disabled="$store.sim.simRunning"
              @click="$store.sim.runSimulate()">
              <span x-show="!$store.sim.simRunning">▶ 开始模拟</span>
              <span x-show="$store.sim.simRunning">⏳ 运行中…</span>
            </button>
          </section>

        </div>
      </aside>

      <!-- ╔══ 中栏：队伍构建 ══╗ -->
      <div class="panel panel-center">

        <!-- 槽位选择条 -->
        <div class="slot-bar">
          <template x-for="(slot, i) in $store.sim.team" :key="i">
            <button class="slot-tab"
              :class="{
                'slot-tab--active':  $store.sim.activeSlot === i,
                'slot-tab--filled':  !!slot.resourceId,
                'slot-tab--disabled': !slot.active && !slot.resourceId
              }"
              @click="$store.sim.handleSlotClick(i)">
              <span class="slot-tab-num" x-text="i + 1"></span>
              <span class="slot-tab-name" x-text="slot.resourceId ? slot.name : '空'"></span>
              <span class="slot-tab-burst" x-show="slot.resourceId"
                x-text="$store.sim.burstLabel(slot.burstStep)"></span>
            </button>
          </template>
        </div>

        <!-- 活跃槽位详情 -->
        <div class="panel-scroll slot-detail">

          <!-- 空槽位 -->
          <template x-if="!$store.sim.activeSlotData.resourceId">
            <div class="empty-slot">
              <div class="empty-slot-num">槽位 <span x-text="$store.sim.activeSlot + 1"></span></div>
              <button class="btn btn-primary"
                @click="$store.sim.openCharPicker($store.sim.activeSlot)">
                + 选择 NIKKE
              </button>
            </div>
          </template>

          <!-- 已选角色 -->
          <template x-if="$store.sim.activeSlotData.resourceId">
            <div class="slot-form" x-data="{ showSkills: true, showEquip: true, showCube: true, showFav: true }">

              <!-- 角色头部 -->
              <div class="char-header">
                <div class="char-info">
                  <div class="char-name" x-text="$store.sim.activeSlotData.name"></div>
                  <div class="char-tags">
                    <span class="tag" x-text="$store.sim.classLabel($store.sim.activeSlotData.classType)"></span>
                    <span class="tag" x-text="$store.sim.elementLabel($store.sim.activeSlotData.element)"></span>
                    <span class="tag" x-text="$store.sim.activeSlotData.weaponType"></span>
                    <span class="tag" x-text="$store.sim.corpLabel($store.sim.activeSlotData.corporation)"></span>
                    <span class="tag tag-burst" x-text="$store.sim.burstLabel($store.sim.activeSlotData.burstStep)"></span>
                    <span class="tag tag-dim" x-show="$store.sim.activeSlotData._loading">加载中…</span>
                  </div>
                </div>
                <div class="char-actions">
                  <button class="btn btn-ghost btn-sm"
                    @click="$store.sim.openCharPicker($store.sim.activeSlot)">更换</button>
                  <button class="btn btn-ghost btn-sm"
                    @click="$store.sim.clearSlot($store.sim.activeSlot)">清除</button>
                </div>
              </div>

              <!-- 极限突破 / 核心加强 / 好感度 -->
              <section class="card">
                <div class="grade-all-row">
                  <div class="grade-field">
                    <label class="grade-field-label">突破</label>
                    <input class="input" type="number" min="0" max="3"
                      x-model.number="$store.sim.activeSlotData.grade"
                      @change="$store.sim.setGrade($store.sim.activeSlot, $store.sim.activeSlotData.grade)">
                  </div>
                  <div class="grade-field">
                    <label class="grade-field-label"
                      :title="$store.sim.activeSlotData.grade < 3 ? '极限突破 3 解锁' : '核心加强等级'">核心</label>
                    <input class="input" type="number" min="0" max="7"
                      :disabled="$store.sim.activeSlotData.grade < 3"
                      x-model.number="$store.sim.activeSlotData.core"
                      @change="$store.sim.clampCore($store.sim.activeSlot)">
                  </div>
                  <div class="grade-field">
                    <label class="grade-field-label"
                      :title="'好感度上限 ' + $store.sim.maxBond($store.sim.activeSlotData.grade, $store.sim.activeSlotData.corporation)">好感</label>
                    <input class="input" type="number" min="1"
                      :max="$store.sim.maxBond($store.sim.activeSlotData.grade, $store.sim.activeSlotData.corporation)"
                      x-model.number="$store.sim.activeSlotData.bondLevel"
                      @change="$store.sim.clampBond($store.sim.activeSlot)">
                  </div>
                </div>
              </section>

              <!-- 技能 -->
              <section class="card">
                <div class="section-toggle" @click="showSkills = !showSkills">
                  <h3 class="sub-title">技能</h3>
                  <span class="toggle-icon" x-text="showSkills ? '▲' : '▼'"></span>
                </div>
                <div x-show="showSkills">
                  <template x-for="(label, j) in ['技能 1','技能 2','Burst']" :key="j">
                    <div class="skill-row">
                      <div class="skill-meta">
                        <span class="skill-slot-label" x-text="label"></span>
                        <div class="skill-lv-ctrl">
                          <button class="lv-btn"
                            @click="if ($store.sim.activeSlotData.skills[j] > 1) $store.sim.activeSlotData.skills[j]--">−</button>
                          <span class="skill-lv-num" x-text="'Lv ' + $store.sim.activeSlotData.skills[j]"></span>
                          <button class="lv-btn"
                            @click="if ($store.sim.activeSlotData.skills[j] < 10) $store.sim.activeSlotData.skills[j]++">+</button>
                        </div>
                      </div>
                      <template x-if="$store.sim.activeSlotData._nikkeData">
                        <div class="skill-desc-block">
                          <div class="skill-name-row"
                            x-text="$store.sim.effectiveSkillDetail($store.sim.activeSlot, j)?.name_localkey ?? ''">
                          </div>
                          <p class="skill-desc"
                            x-html="$store.sim.renderSkillHtml(
                              $store.sim.effectiveSkillDetail($store.sim.activeSlot, j),
                              $store.sim.activeSlotData.skills[j]
                            )">
                          </p>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </section>

              <!-- 装备 -->
              <section class="card">
                <div class="section-toggle" @click="showEquip = !showEquip">
                  <h3 class="sub-title">装备（T10）</h3>
                  <span class="toggle-icon" x-text="showEquip ? '▲' : '▼'"></span>
                </div>
                <div x-show="showEquip">
                  <template x-for="key in $store.sim.EQUIP_SLOTS" :key="key">
                    <div class="equip-block">
                      <div class="equip-header">
                        <span class="equip-slot-label" x-text="$store.sim.EQUIP_SLOT_LABELS[key]"></span>
                        <div class="row-inline">
                          <span class="field-hint">等级</span>
                          <select class="input input-sm"
                            :value="$store.sim.activeSlotData.equipment[key].level"
                            @change="$store.sim.activeSlotData.equipment[key].level = +$event.target.value">
                            <template x-for="lv in [0,1,2,3,4,5]" :key="lv">
                              <option :value="lv" :selected="lv === $store.sim.activeSlotData.equipment[key].level" x-text="lv"></option>
                            </template>
                          </select>
                        </div>
                      </div>
                      <div class="equip-opts">
                        <template x-for="(opt, oi) in $store.sim.activeSlotData.equipment[key].opts" :key="oi">
                          <div class="opt-row">
                            <select class="input input-sm opt-type"
                              @change="opt.type = $event.target.value">
                              <template x-for="ot in $store.sim.EQUIP_OPTION_TYPES" :key="ot.key">
                                <option :value="ot.key" :selected="ot.key === opt.type" x-text="ot.label"></option>
                              </template>
                            </select>
                            <select class="input input-sm opt-val"
                              x-show="opt.type && $store.sim.EQUIP_OPTION_TYPES.find(t => t.key === opt.type)?.vals?.length"
                              @change="opt.value = parseFloat($event.target.value) || 0">
                              <template x-for="v in ($store.sim.EQUIP_OPTION_TYPES.find(t => t.key === opt.type)?.vals ?? [])" :key="v">
                                <option :value="v" :selected="v === opt.value" x-text="(v / 100).toFixed(2) + '%'"></option>
                              </template>
                            </select>
                            <input class="input input-sm opt-val"
                              x-show="opt.type && !$store.sim.EQUIP_OPTION_TYPES.find(t => t.key === opt.type)?.vals?.length"
                              x-model.number="opt.value"
                              type="number" min="0" step="1" placeholder="数值">
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
              </section>

              <!-- 和谐魔方 -->
              <section class="card">
                <div class="section-toggle" @click="showCube = !showCube">
                  <h3 class="sub-title">和谐魔方</h3>
                  <span class="toggle-icon" x-text="showCube ? '▲' : '▼'"></span>
                </div>
                <div x-show="showCube">
                  <div class="row-2">
                    <div class="field-group">
                      <label class="field-label">魔方</label>
                      <select class="input"
                        @change="$store.sim.activeSlotData.cube.resourceId = +$event.target.value || null; $store.sim.onCubeChange($store.sim.activeSlot)">
                        <option value="" :selected="!$store.sim.activeSlotData.cube.resourceId">（无）</option>
                        <template x-for="c in $store.sim.cubeOptions" :key="c.id">
                          <option :value="c.id" :selected="c.id === $store.sim.activeSlotData.cube.resourceId" x-text="c.name"></option>
                        </template>
                      </select>
                    </div>
                    <div class="field-group">
                      <label class="field-label">等级（1–15）</label>
                      <input class="input" type="number" min="1" max="15"
                        x-model.number="$store.sim.activeSlotData.cube.level">
                    </div>
                  </div>
                  <template x-if="$store.sim.activeSlotData._cubeData">
                    <div class="cube-skill-wrap"
                      x-html="$store.sim.cubeSkillHtml($store.sim.activeSlot)">
                    </div>
                  </template>
                </div>
              </section>

              <!-- 珍藏品 -->
              <section class="card">
                <div class="section-toggle" @click="showFav = !showFav">
                  <h3 class="sub-title">珍藏品</h3>
                  <span class="toggle-icon" x-text="showFav ? '▲' : '▼'"></span>
                </div>
                <div x-show="showFav">
                  <div class="row-2">
                    <div class="field-group">
                      <label class="field-label">道具</label>
                      <select class="input"
                        @change="$store.sim.activeSlotData.favoriteItem.resourceId = +$event.target.value || null; $store.sim.onFavChange($store.sim.activeSlot)">
                        <option value="" :selected="!$store.sim.activeSlotData.favoriteItem.resourceId">（无）</option>
                        <template x-for="f in $store.sim.favItemsForSlot($store.sim.activeSlot)" :key="f.id">
                          <option :value="f.id" :selected="f.id === $store.sim.activeSlotData.favoriteItem.resourceId" x-text="f.name"></option>
                        </template>
                      </select>
                    </div>
                    <div class="field-group" x-show="($store.sim.activeSlotData.favoriteItem.resourceId ?? 0) < 200000">
                      <label class="field-label">等级（0–15）</label>
                      <input class="input" type="number" min="0" max="15"
                        x-model.number="$store.sim.activeSlotData.favoriteItem.level">
                    </div>
                    <div class="field-group" x-show="($store.sim.activeSlotData.favoriteItem.resourceId ?? 0) >= 200000">
                      <label class="field-label">等级</label>
                      <select class="input" x-model.number="$store.sim.activeSlotData.favoriteItem.level">
                        <option :value="0">Lv5</option>
                        <option :value="1">Lv10</option>
                        <option :value="2">Lv15</option>
                      </select>
                    </div>
                  </div>
                  <template x-if="$store.sim.activeSlotData._favData">
                    <div class="fav-skill-wrap"
                      x-html="$store.sim.favSkillHtml($store.sim.activeSlot)">
                    </div>
                  </template>
                </div>
              </section>

              <!-- 最终属性 -->
              <section class="card"
                x-data="{ get stats() { return $store.sim.computedStats($store.sim.activeSlot); } }">
                <h3 class="sub-title">最终属性</h3>
                <template x-if="stats">
                  <div>
                    <div class="stats-grid">
                      <div class="stat-item">
                        <span class="stat-label">HP</span>
                        <span class="stat-value" x-text="$store.sim.fmtStat(stats.hp)"></span>
                      </div>
                      <div class="stat-item">
                        <span class="stat-label">ATK</span>
                        <span class="stat-value"
                          x-text="$store.sim.fmtStat(stats.atk)"
                          :title="stats.equipAtkPct > 0 ? '基础值（不含词条 ATK% 乘法）；词条 ATK% = ' + (stats.equipAtkPct * 100).toFixed(2) + '%' : ''">
                        </span>
                      </div>
                      <div class="stat-item">
                        <span class="stat-label">DEF</span>
                        <span class="stat-value" x-text="$store.sim.fmtStat(stats.def)"></span>
                      </div>
                    </div>
                    <div class="stats-extras">
                      <template x-if="stats.elementDmgPct > 0">
                        <span class="stat-badge">优越代码伤害增加 +<b x-text="$store.sim.fmtPct(stats.elementDmgPct)"></b></span>
                      </template>
                      <template x-if="stats.hitRatePct > 0">
                        <span class="stat-badge">命中率增加 +<b x-text="$store.sim.fmtPct(stats.hitRatePct)"></b></span>
                      </template>
                      <template x-if="stats.bonusAmmo > 0">
                        <span class="stat-badge">最大装弹数增加 +<b x-text="$store.sim.fmtPct(stats.bonusAmmo)"></b></span>
                      </template>
                      <template x-if="stats.equipAtkPct > 0">
                        <span class="stat-badge">攻击力增加 +<b x-text="$store.sim.fmtPct(stats.equipAtkPct)"></b></span>
                      </template>
                      <template x-if="stats.equipAtkFlat > 0">
                        <span class="stat-badge">攻击力增加（固定值） +<b x-text="$store.sim.fmtStat(stats.equipAtkFlat)"></b></span>
                      </template>
                      <template x-if="stats.chargeDmgPct > 0">
                        <span class="stat-badge">蓄力伤害增加 +<b x-text="$store.sim.fmtPct(stats.chargeDmgPct)"></b></span>
                      </template>
                      <template x-if="stats.chargeSpeedPct > 0">
                        <span class="stat-badge">蓄力速度增加 +<b x-text="$store.sim.fmtPct(stats.chargeSpeedPct)"></b></span>
                      </template>
                      <template x-if="stats.critRate > 0.15">
                        <span class="stat-badge">暴击率增加 +<b x-text="$store.sim.fmtPct(stats.critRate - 0.15)"></b></span>
                      </template>
                      <template x-if="stats.critDmg > 0.50">
                        <span class="stat-badge">暴击伤害增加 +<b x-text="$store.sim.fmtPct(stats.critDmg - 0.50)"></b></span>
                      </template>
                      <template x-if="stats.equipDefPct > 0">
                        <span class="stat-badge">防御力增加 +<b x-text="$store.sim.fmtPct(stats.equipDefPct)"></b></span>
                      </template>
                    </div>
                  </div>
                </template>
                <template x-if="!stats">
                  <p class="hint">角色 CDN 数据加载完成后显示</p>
                </template>
              </section>

            </div>
          </template>
        </div>
      </div>

      <!-- ╔══ 右栏：结果 ══╗ -->
      <aside class="panel panel-right">

          <template x-if="!$store.sim.result && !$store.sim.simRunning">
            <div class="empty-result">
              <p>配置队伍后<br>点击 ▶ 查看结果</p>
            </div>
          </template>

          <template x-if="$store.sim.simRunning">
            <div class="empty-result">
              <p>⏳ 正在模拟…</p>
            </div>
          </template>

          <template x-if="$store.sim.result && !$store.sim.simRunning">
            <div class="result-panel">

              <!-- 固定区域：结果 + 技能伤害 -->
              <div class="result-panel-fixed">

                <!-- 总览 -->
                <section class="card">
                  <h2 class="card-title">
                    结果
                    <span class="card-subtitle" x-text="'(' + $store.sim.result.iterations + ' 次平均)'"></span>
                  </h2>
                  <div class="result-summary">
                    <div class="result-kv">
                      <span class="result-label">总伤害</span>
                      <span class="result-value result-value--main"
                        x-text="$store.sim.fmtNum($store.sim.result.totalDamage ?? 0)"></span>
                    </div>

                    <div class="result-kv">
                      <span class="result-label">Full Burst 次数</span>
                      <span class="result-value"
                        x-text="Math.round($store.sim.result.burstCount ?? 0)"></span>
                    </div>
                  </div>
                </section>

                <!-- 各角色伤害 -->
                <section class="card">
                  <h3 class="sub-title">角色伤害</h3>
                  <template x-for="unit in $store.sim.result.units" :key="unit.id">
                    <div class="unit-block">
                      <div class="unit-header">
                        <span class="unit-name" x-text="unit.name"></span>
                        <span class="unit-total" x-text="$store.sim.fmtNum(unit.totalDamage)"></span>
                      </div>

                      <div class="skill-breakdown">
                        <template x-for="row in $store.sim.skillDamageRows(unit)" :key="row.label">
                          <div class="skill-dmg-row">
                            <span class="skill-dmg-label log-label--tip"
                              @mouseenter="$store.sim.showSkillTooltip($event, row)"
                              @mouseleave="$store.sim.hideSkillTooltip()"
                              x-text="row.label"></span>
                            <div class="share-bar share-bar--sm">
                              <div class="share-fill"
                                :style="'width:' + (row.share * 100).toFixed(1) + '%'">
                              </div>
                            </div>
                            <span class="skill-dmg-count" x-show="row.count > 0"
                              x-text="'×' + Math.round(row.count)"></span>
                            <span class="skill-dmg-val" x-text="$store.sim.fmtNum(row.damage)"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </section>

              </div><!-- /result-panel-fixed -->

              <!-- 可压缩区域：战斗日志 -->
              <div class="result-panel-log">
                <section class="card card--log">
                  <div class="log-header">
                    <h3 class="sub-title" style="white-space:nowrap">战斗日志</h3>
                    <div class="log-filters" x-show="$store.sim.hitLogRows.length > 0">
                      <template x-for="name in $store.sim.logUnitNames()" :key="name">
                        <button class="log-filter-btn"
                          :class="!$store.sim.logHiddenUnits.includes(name) ? 'log-filter-btn--active' : ''"
                          @click="$store.sim.toggleLogUnit(name)"
                          x-text="name"></button>
                      </template>
                      <button class="log-filter-btn"
                        :class="$store.sim.showLogNormal ? 'log-filter-btn--active' : ''"
                        @click="$store.sim.showLogNormal = !$store.sim.showLogNormal">普通攻击</button>
                    </div>
                    <div class="log-mode-btns">
                      <button class="btn btn-sm"
                        :class="$store.sim.logMode === 'aggregate' ? 'btn-primary' : 'btn-ghost'"
                        @click="$store.sim.setLogMode('aggregate')">聚合</button>
                      <button class="btn btn-sm"
                        :class="$store.sim.logMode === 'detail' ? 'btn-primary' : 'btn-ghost'"
                        @click="$store.sim.setLogMode('detail')">详细</button>
                    </div>
                  </div>
                  <div class="log-table-wrap">
                    <table class="log-table">
                      <thead>
                        <tr>
                          <th class="log-line-hd">#</th>
                          <th>时间</th>
                          <th>施展者</th>
                          <th>技能</th>
                          <th>目标</th>
                          <th>Buff</th>
                          <th style="text-align:right">伤害</th>
                          <th x-show="$store.sim.logMode === 'detail'" style="text-align:right">弹药</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="(row, ri) in $store.sim.filteredLogRows()" :key="ri">
                          <tr :class="(row.kind === 'event' ? 'log-row--event log-row--ev-' + row.eventType : '') + (row.inFullBurst ? ' log-row--in-fb' : '')">
                            <td class="log-line" x-text="ri + 1"></td>
                            <td class="log-time mono" x-text="row.kind !== 'event' && row.tickEnd > row.tickStart ? $store.sim.formatTick(row.tickStart) + '~' + $store.sim.formatTick(row.tickEnd) : $store.sim.formatTick(row.tickStart)"></td>
                            <td x-text="row.name"></td>
                            <td class="log-label log-label--tip"
                              @mouseenter="$store.sim.showSkillTooltip($event, row)"
                              @mouseleave="$store.sim.hideSkillTooltip()">
                              <span x-text="row.label"></span>
                              <span class="log-count" x-show="row.count > 1" x-text="'×' + row.count"></span>
                            </td>
                            <td x-text="row.target ?? ''"></td>
                            <td class="log-buff">
                              <span class="hit-tag hit-tag--crit"
                                x-show="row._hit && row.isCrit">暴击</span>
                              <span class="hit-tag hit-tag--core"
                                x-show="row._hit && row.isCore">命中核心</span>
                              <span class="hit-tag hit-tag--dist"
                                x-show="row._hit && row.distanceAdv">优势距离</span>
                              <span x-text="row.buffDesc"></span>
                            </td>
                            <td class="log-dmg mono"
                              :class="$store.sim.logMode === 'detail' && row._hit ? 'log-dmg--tip' : ''"
                              x-text="row.damage != null ? $store.sim.fmtNum(row.damage) : ''"
                              @mouseenter="$store.sim.logMode === 'detail' && row._hit && $store.sim.showDmgTooltip($event, row._hit)"
                              @mouseleave="$store.sim.hideDmgTooltip()"></td>
                            <td class="log-ammo mono" x-show="$store.sim.logMode === 'detail'"
                              x-text="row.charge ?? ''"></td>
                          </tr>
                        </template>
                        <template x-if="!$store.sim.hitLogRows.length">
                          <tr><td colspan="8" class="log-empty">无伤害记录</td></tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </section>
              </div><!-- /result-panel-log -->

            </div>
          </template>

      </aside>

    </div><!-- /layout -->

  </div><!-- /app -->

  <!-- ── 角色选择器弹窗 ──────────────────────────────────────── -->
  <div class="modal-overlay"
       x-data
       x-show="$store.sim.charPickerSlot >= 0"
       x-transition.opacity
       @click.self="$store.sim.closeCharPicker()"
       style="display:none">
    <div class="modal-box" @click.stop>
      <div class="modal-header">
        <h2 class="modal-title">选择 NIKKE</h2>
        <button class="btn btn-ghost btn-sm" @click="$store.sim.closeCharPicker()">✕</button>
      </div>
      <input class="input modal-search" type="text"
        placeholder="按名字搜索…"
        x-model="$store.sim.charQuery">
      <div class="char-grid">
        <template x-for="char in $store.sim.filteredChars" :key="char.resourceId">
          <button class="char-card"
            :class="{ 'char-card--unmodeled': !char.modeled }"
            :disabled="!char.modeled"
            :title="char.modeled ? '' : '技能未建模'"
            @click="$store.sim.selectChar(char.resourceId)">
            <span class="char-card-name" x-text="char.name"></span>
            <span class="char-card-meta">
              <span x-text="$store.sim.classLabel(char.classType)"></span>
              · <span x-text="char.weaponType"></span>
            </span>
          </button>
        </template>
      </div>
    </div>
  </div>

  <div id="dmg-tooltip"   class="dmg-tooltip"   style="display:none"></div>
  <div id="skill-tooltip" class="skill-tooltip" style="display:none"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
