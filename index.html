<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIKKE 战斗模拟器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 加载遮罩 -->
  <div id="loader">
    <div class="loader-box">
      <h2>NIKKE 战斗模拟器</h2>
      <p id="loadProgress">正在初始化…</p>
      <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="hidden">
    <header>
      <h1>NIKKE 战斗模拟器</h1>
      <p class="subtitle">模拟队伍对任意敌方配置的 DPS</p>
    </header>

    <main>
      <div id="squadBuilder"></div>
      <div id="results">
        <p class="loading-text">在上方配置你的队伍，然后点击"开始模拟"查看 DPS 结果。</p>
      </div>
    </main>

    <footer>
      <p>
        数据来源：sg-tools-cdn.blablalink.com ·
        伤害公式来自社区研究 ·
        <a href="ARCHITECTURE.md" target="_blank">架构</a>
      </p>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
